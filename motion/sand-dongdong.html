<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冬冬 · 沙画</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, 177.78vh); height: auto; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// 冬冬 — a 60-second sand-art film on an amber light box.
//
// Six tableaux, each drawn in sand and then swept or flowed into the next:
//   0–10s  sand pours onto the glass, a finger writes 冬冬, the last dot becomes the moon
//  10–20s  night: the cattery van arrives, the seller hands over the carrier, two eyes light up
//  20–30s  close-up: 冬冬's face emerges, a hand reaches out, a paw touches the finger
//  30–40s  life together: chasing yarn, asleep by the laptop, the three of them on the sofa
//  40–50s  four seasons outside the window while 冬冬 grows up on the sill
//  50–60s  the rooftop under the moon, then everything is swept away but the moon: 冬冬, thank you
//
// The sand engine is the one from sand-lookdev.html: a density field (pour adds,
// a finger carves and piles a ridge, a palm sweeps it into a bank), shaded with
// Beer-Lambert absorption and multi-scale grain against the light box.

const W = 1280, H = 720, FPS = 30, DURATION = 60;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const newCanvas = () => new OffscreenCanvas(W, H);
const dens = newCanvas();
const dctx = dens.getContext('2d', { willReadFrequently: true });
const bloom = new OffscreenCanvas(W / 4, H / 4);
const bctx = bloom.getContext('2d');
// scratch layers for transitions (TA/TB) and morphs inside a scene (TC/TD)
const TA = newCanvas(), TB = newCanvas(), TC = newCanvas(), TD = newCanvas();

const LOOK = { light: [[255, 216, 134], [236, 142, 44], [112, 48, 12]], sand: [30, 13, 5], k: 3.6, grain: 0.8 };
const CJK = '"WenQuanYi Zen Hei", sans-serif';

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const smooth = k => k * k * (3 - 2 * k);
function rng(seed) {   // mulberry32
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const bez = (p0, c, p1, t) => [
  (1 - t) * (1 - t) * p0[0] + 2 * (1 - t) * t * c[0] + t * t * p1[0],
  (1 - t) * (1 - t) * p0[1] + 2 * (1 - t) * t * c[1] + t * t * p1[1],
];
// Sample a chain of quadratic segments [[p0, c, p1], ...] into a polyline.
function sample(segs, n = 24) {
  const pts = [];
  segs.forEach(([p0, c, p1], i) => { for (let j = i ? 1 : 0; j <= n; j++) pts.push(bez(p0, c, p1, j / n)); });
  return pts;
}
const ellipsePath = (P, x, y, rx, ry, rot = 0) => { P.moveTo(x + rx * Math.cos(rot), y + rx * Math.sin(rot)); P.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); };

// ---------- sand operations on the density canvas ----------
function clearSand(c = dctx) {
  c.save();
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; c.filter = 'none';
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  c.restore();
}
function pour(drawPath, amount, blur = 1.5) {
  if (amount <= 0) return;
  dctx.save();
  dctx.globalCompositeOperation = 'lighter';
  dctx.filter = blur ? `blur(${blur}px)` : 'none';
  dctx.fillStyle = `rgba(255,255,255,${clamp(amount)})`;
  dctx.strokeStyle = dctx.fillStyle;
  drawPath(dctx);
  dctx.restore();
}
// Push sand away completely inside a shape (soft edged), e.g. a window opening.
function clearShape(drawPath, amount = 1, blur = 2) {
  if (amount <= 0) return;
  dctx.save();
  dctx.globalCompositeOperation = 'source-over';
  dctx.filter = blur ? `blur(${blur}px)` : 'none';
  dctx.fillStyle = `rgba(0,0,0,${clamp(amount)})`;
  dctx.strokeStyle = dctx.fillStyle;
  drawPath(dctx);
  dctx.restore();
}
// Clear a union of shapes in one go: drawn opaque into the scratch mask first,
// so overlapping parts are not cleared twice (no visible seams).
function clearUnion(drawPath, amount = 1, blur = 3) {
  if (amount <= 0) return;
  mctx.clearRect(0, 0, W, H);
  mctx.save(); mctx.fillStyle = '#000'; mctx.strokeStyle = '#000'; drawPath(mctx); mctx.restore();
  dctx.save();
  dctx.globalCompositeOperation = 'source-over';
  dctx.filter = `blur(${blur}px)`;
  dctx.globalAlpha = clamp(amount);
  dctx.drawImage(MASK, 0, 0);
  dctx.restore();
}
// A finger line: clears sand along the path and leaves a ridge on both sides.
// Width follows finger pressure; drawn into scratch masks first so overlapping
// segments never stack into beads.
const MASK = newCanvas(), mctx = MASK.getContext('2d');
const RIDGE = newCanvas(), rctx = RIDGE.getContext('2d');
function bounds(pts, n, pad) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i < n; i++) { x0 = Math.min(x0, pts[i][0]); y0 = Math.min(y0, pts[i][1]); x1 = Math.max(x1, pts[i][0]); y1 = Math.max(y1, pts[i][1]); }
  const bx = Math.max(0, Math.floor(x0 - pad)), by = Math.max(0, Math.floor(y0 - pad));
  return [bx, by, Math.min(W, Math.ceil(x1 + pad)) - bx, Math.min(H, Math.ceil(y1 + pad)) - by];
}
function applyMasks(bx, by, bw, bh, strength) {
  dctx.save();
  dctx.globalCompositeOperation = 'lighter';
  dctx.filter = 'blur(2.5px)';
  dctx.globalAlpha = 0.2 * strength;
  dctx.drawImage(RIDGE, bx, by, bw, bh, bx, by, bw, bh);
  dctx.globalCompositeOperation = 'source-over';
  dctx.filter = 'blur(1.2px)';
  dctx.globalAlpha = 0.95 * strength;
  dctx.drawImage(MASK, bx, by, bw, bh, bx, by, bw, bh);
  dctx.restore();
}
function carve(pts, width, upTo = 1, strength = 1, press = null) {
  if (upTo <= 0 || strength <= 0) return;
  const n = Math.max(2, Math.floor(pts.length * clamp(upTo)));
  press = press || (i => { const u = i / (pts.length - 1); return 0.35 + 0.65 * Math.sin(Math.PI * clamp(u * 1.08 - 0.04)) * (0.85 + 0.3 * hash(i * 0.37)); });
  const [bx, by, bw, bh] = bounds(pts, n, width + 20);
  if (bw <= 0 || bh <= 0) return;
  for (const [c, extra, color] of [[mctx, 0, '#000'], [rctx, 8, '#fff']]) {
    c.clearRect(bx, by, bw, bh);
    c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = color;
    for (let i = 0; i < n - 1; i++) {
      c.lineWidth = width * press(i) + extra;
      c.beginPath(); c.moveTo(...pts[i]); c.lineTo(...pts[i + 1]); c.stroke();
    }
  }
  applyMasks(bx, by, bw, bh, strength);
}
// Text written into the sand, revealed left to right like a moving fingertip.
function carveText(str, x, y, size, reveal, strength = 1) {
  if (reveal <= 0 || strength <= 0) return;
  const font = `${size}px ${CJK}`;
  mctx.font = font; const w = mctx.measureText(str).width;
  const bx = Math.max(0, Math.floor(x - w / 2 - 20)), by = Math.max(0, Math.floor(y - size - 20));
  const bw = Math.ceil(w + 40), bh = Math.ceil(size * 1.6 + 40);
  for (const [c, color, line] of [[mctx, '#000', size * 0.035], [rctx, '#fff', size * 0.2]]) {
    c.clearRect(bx, by, bw, bh);
    c.font = font; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.fillStyle = color; c.strokeStyle = color; c.lineWidth = line; c.lineJoin = 'round';
    c.fillText(str, x, y); c.strokeText(str, x, y);
    const rx = x - w / 2 + w * reveal;
    c.clearRect(rx, by, bx + bw - rx, bh);
  }
  dctx.save();
  dctx.globalCompositeOperation = 'lighter';
  dctx.filter = 'blur(2px)';
  dctx.globalAlpha = 0.1 * strength;
  dctx.drawImage(RIDGE, bx, by, bw, bh, bx, by, bw, bh);
  dctx.globalCompositeOperation = 'source-over';
  dctx.filter = 'blur(0.7px)';
  dctx.globalAlpha = strength;
  dctx.drawImage(MASK, bx, by, bw, bh, bx, by, bw, bh);
  dctx.restore();
}
function poke(x, y, r, amount = 1) {   // fingertip dot
  if (amount <= 0) return;
  dctx.save();
  dctx.globalCompositeOperation = 'lighter';
  dctx.filter = 'blur(1.5px)';
  dctx.fillStyle = `rgba(255,255,255,${0.2 * amount})`;
  dctx.beginPath(); dctx.arc(x, y, r + 3, 0, Math.PI * 2); dctx.fill();
  dctx.globalCompositeOperation = 'source-over';
  dctx.fillStyle = `rgba(0,0,0,${0.9 * amount})`;
  dctx.beginPath(); dctx.arc(x, y, r, 0, Math.PI * 2); dctx.fill();
  dctx.restore();
}
// Fur: many short, soft tufts along an outline, pointing outwards.
function furEdge(edge, amount, len = 6, seed = 0) {
  pour(c => {
    c.lineCap = 'round'; c.lineWidth = 1.6;
    c.beginPath();
    edge.forEach(([x, y, a], i) => {
      for (let k = 0; k < 2; k++) {
        const aa = a + (hash(i * 2 + k + seed) - 0.5) * 1.1, l = 2 + hash(i * 3 + k + seed) * len;
        const x0 = x - Math.cos(a) * 2, y0 = y - Math.sin(a) * 2;
        c.moveTo(x0, y0); c.lineTo(x0 + Math.cos(aa) * l, y0 + Math.sin(aa) * l);
      }
    });
    c.stroke();
  }, 0.55 * amount, 0.5);
}
// Outline points (with outward angle) of a union of ellipses, for fur.
function unionEdge(shapes, density = 2.2, cutY = Infinity) {
  const inside = (x, y, skip) => shapes.some((e, j) => j !== skip && ((x - e.x) / e.rx) ** 2 + ((y - e.y) / e.ry) ** 2 < 1);
  const edge = [];
  shapes.forEach((e, j) => {
    const n = Math.round((e.rx + e.ry) * density);
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2, x = e.x + e.rx * Math.cos(a), y = e.y + e.ry * Math.sin(a);
      if (!inside(x, y, j) && y < cutY) edge.push([x, y, a]);
    }
  });
  return edge;
}

// ---------- the light box: base sand layer ----------
// Thin, luminous sand around a focal point; sand banked into a soft uneven
// frame at the edges of the glass.
function base(p, fx, fy, { thin = 0.03, thick = 0.5, frame = 0.16 } = {}) {
  if (p <= 0) return;
  pour(c => {
    const g = c.createRadialGradient(fx, fy, 60, fx + 60, fy + 40, 980);
    g.addColorStop(0, `rgba(255,255,255,${thin * p})`);
    g.addColorStop(0.3, `rgba(255,255,255,${lerp(thin, thick, 0.35) * p})`);
    g.addColorStop(0.7, `rgba(255,255,255,${lerp(thin, thick, 0.7) * p})`);
    g.addColorStop(1, `rgba(255,255,255,${thick * p})`);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  }, 1, 0);
  pour(c => {
    for (let i = 0; i < 4; i++) {
      const inset = 10 + i * 26;
      c.lineWidth = 120 - i * 18;
      c.beginPath();
      for (let j = 0; j <= 40; j++) {
        const u = j / 40, side = Math.floor(u * 4), f = u * 4 - side;
        const wob = (hash(j * 7 + i) - 0.5) * 30;
        const pts = [[inset + f * (W - 2 * inset), inset + wob], [W - inset + wob, inset + f * (H - 2 * inset)],
          [W - inset - f * (W - 2 * inset), H - inset + wob], [inset + wob, H - inset - f * (H - 2 * inset)]][side % 4];
        j ? c.lineTo(...pts) : c.moveTo(...pts);
      }
      c.closePath(); c.stroke();
    }
  }, frame * p, 45);
}

// ---------- shared figures ----------
// A standing person in silhouette; f = 1 faces right, -1 faces left.
function person(x, by, h, { f = 1, hair = 'short', skirt = false, stride = 0, carry = false } = {}, amount = 1) {
  const P = new Path2D(), A = new Path2D();
  const hr = h * 0.075, hx = x + f * h * 0.012, hy = by - h * 0.915;
  ellipsePath(P, hx, hy, hr * 0.92, hr);
  if (hair === 'long') ellipsePath(P, hx - f * hr * 0.35, hy + hr * 0.9, hr * 0.85, hr * 1.7);
  if (hair === 'short') ellipsePath(P, hx - f * hr * 0.1, hy - hr * 0.12, hr * 1.0, hr * 0.92);
  P.rect(x - h * 0.022, hy + hr * 0.7, h * 0.044, h * 0.07);
  const sh = by - h * 0.8, wa = by - h * 0.47;
  P.moveTo(x - h * 0.105, sh + h * 0.02);
  P.quadraticCurveTo(x, sh - h * 0.02, x + h * 0.105, sh + h * 0.02);
  P.lineTo(x + h * 0.08, wa); P.lineTo(x - h * 0.08, wa); P.closePath();
  const kneeY = by - h * 0.24;
  if (skirt) {
    P.moveTo(x - h * 0.08, wa - 2); P.lineTo(x + h * 0.08, wa - 2);
    P.lineTo(x + h * 0.15, kneeY); P.lineTo(x - h * 0.15, kneeY); P.closePath();
  }
  // legs (tapered), spread by the stride
  for (const s of [-1, 1]) {
    const hip = x + s * h * 0.04, foot = x + s * h * 0.045 + s * stride * h * 0.12;
    P.moveTo(hip - h * 0.04, wa); P.lineTo(hip + h * 0.04, wa);
    P.lineTo(foot + h * 0.022, by - h * 0.02); P.lineTo(foot + f * h * 0.06, by); P.lineTo(foot - h * 0.03, by);
    P.closePath();
  }
  // arms
  const shX = x + f * h * 0.07;
  if (carry) {
    A.moveTo(shX, sh + h * 0.04); A.quadraticCurveTo(shX + f * h * 0.06, sh + h * 0.2, shX + f * h * 0.16, sh + h * 0.3);
  } else {
    A.moveTo(shX, sh + h * 0.04); A.quadraticCurveTo(shX + f * h * 0.03, sh + h * 0.2, shX + f * h * 0.01, sh + h * 0.36);
  }
  A.moveTo(x - f * h * 0.08, sh + h * 0.04); A.quadraticCurveTo(x - f * h * 0.11, sh + h * 0.2, x - f * h * 0.09, sh + h * 0.35);
  pour(c => {
    c.fill(P);
    c.lineCap = 'round'; c.lineWidth = h * 0.045; c.stroke(A);
  }, amount, 1.2);
}

// 冬冬 from behind, sitting: round chinchilla made of soft shapes. s scales it.
function catBack(cx, by, s, amount = 1, { rim = 0, seed = 0 } = {}) {
  const shapes = [
    { x: 0, y: -66, rx: 72, ry: 74 }, { x: 0, y: -128, rx: 54, ry: 42 }, { x: 0, y: -178, rx: 47, ry: 44 },
    { x: -32, y: -160, rx: 24, ry: 20 }, { x: 32, y: -160, rx: 24, ry: 20 },
  ].map(e => ({ x: cx + e.x * s, y: by + e.y * s, rx: e.rx * s, ry: e.ry * s }));
  const ears = [[[-42, -196], [-30, -232], [-10, -214]], [[42, -196], [30, -232], [10, -214]]]
    .map(tri => tri.map(([x, y]) => [cx + x * s, by + y * s]));
  const tail = sample([
    [[cx + 52 * s, by - 12 * s], [cx + 150 * s, by + 2 * s], [cx + 168 * s, by - 46 * s]],
    [[cx + 168 * s, by - 46 * s], [cx + 176 * s, by - 80 * s], [cx + 150 * s, by - 88 * s]],
  ], 18);
  pour(c => {
    shapes.forEach(e => { c.beginPath(); c.ellipse(e.x, e.y, e.rx, e.ry, 0, 0, Math.PI * 2); c.fill(); });
    c.lineJoin = 'round'; c.lineWidth = 6 * s;
    ears.forEach(tri => { c.beginPath(); tri.forEach((q, i) => i ? c.lineTo(...q) : c.moveTo(...q)); c.closePath(); c.fill(); c.stroke(); });
  }, amount, 1.3);
  furEdge(unionEdge(shapes, 2.2, by - 4 * s), amount, 6 * Math.max(0.6, s), seed);
  pour(c => {
    c.lineCap = 'round';
    tail.forEach((q, i) => { if (!i) return; c.lineWidth = lerp(40, 22, i / tail.length) * s; c.beginPath(); c.moveTo(...tail[i - 1]); c.lineTo(...q); c.stroke(); });
  }, 0.85 * amount, 2.2);
  if (rim > 0) {   // moonlight on the side facing the moon
    const arc = (e, a0, a1, inset) => Array.from({ length: 24 }, (_, i) => {
      const a = lerp(a0, a1, i / 23);
      return [e.x + (e.rx - inset) * Math.cos(a), e.y + (e.ry - inset) * Math.sin(a)];
    });
    carve(arc(shapes[2], Math.PI * 1.05, Math.PI * 1.42, 5 * s), 3.2 * s, 1, 0.75 * rim);
    carve(arc(shapes[0], Math.PI * 0.82, Math.PI * 1.12, 6 * s), 3.4 * s, 1, 0.7 * rim);
  }
}

// ---------- hand-written 冬 ----------
// Stroke order of 冬 in a unit box: 撇, 横撇, 捺, 点, 点.
const DONG = [
  { segs: [[[0.47, 0.06], [0.40, 0.18], [0.24, 0.34]]], w: 0.075 },
  { segs: [[[0.38, 0.17], [0.55, 0.15], [0.72, 0.17]], [[0.72, 0.17], [0.58, 0.40], [0.24, 0.58]]], w: 0.07 },
  { segs: [[[0.40, 0.30], [0.58, 0.47], [0.86, 0.60]]], w: 0.085, nab: true },
  { segs: [[[0.46, 0.66], [0.50, 0.69], [0.54, 0.74]]], w: 0.075, dot: true },
  { segs: [[[0.44, 0.82], [0.49, 0.86], [0.54, 0.91]]], w: 0.08, dot: true },
];
// Pressure profiles: 捺 swells towards its end, dots are heavy in the middle.
const PRESS = {
  default: null,
  nab: n => i => { const u = i / (n - 1); return 0.4 + 0.75 * Math.pow(u, 1.4) * (u > 0.88 ? (1 - u) / 0.12 * 0.6 + 0.4 : 1); },
  dot: n => i => { const u = i / (n - 1); return 0.55 + 0.6 * Math.sin(Math.PI * u); },
};
// Draw 冬 at (x, y) with box size; progress 0..1 writes the strokes in order.
// strokeStrength(i) lets strokes fill back in; skip(i) leaves a stroke out.
function writeDong(x, y, size, progress, { strength = () => 1, skip = () => false } = {}) {
  const lens = DONG.map(s => s.segs.reduce((a, [p0, , p1]) => a + Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), 0) + 0.12);
  const total = lens.reduce((a, b) => a + b, 0);
  let acc = 0;
  DONG.forEach((s, i) => {
    const k = clamp((progress * total - acc) / lens[i]);
    acc += lens[i];
    if (k <= 0 || skip(i)) return;
    const pts = sample(s.segs.map(seg => seg.map(([u, v]) => [x + u * size, y + v * size])), 14);
    const press = s.nab ? PRESS.nab(pts.length) : s.dot ? PRESS.dot(pts.length) : null;
    carve(pts, s.w * size, clamp(k * 1.05), strength(i), press);
  });
}

// ---------- scene 1: the title (0 - 10s) ----------
const MOON2 = { x: 300, y: 170, r: 70 };
const CH = [{ x: 360, y: 160, s: 290 }, { x: 630, y: 160, s: 290 }];
const LAST_DOT = [CH[1].x + 0.49 * CH[1].s, CH[1].y + 0.865 * CH[1].s];
function scene1(lt) {
  // sand poured from above: an uneven front sweeping down the glass, grains
  // scattering just ahead of it
  const curtain = easeOut(prog(lt, 0, 2.0));
  base(1, 640, 300, { thin: 0.3, thick: 0.66 });
  if (curtain < 1) {
    const cy = (H + 200) * curtain - 100;
    dctx.save();
    dctx.filter = 'blur(18px)';
    dctx.fillStyle = '#000';
    dctx.beginPath(); dctx.moveTo(-40, H + 40);
    for (let x = -40; x <= W + 40; x += 40) dctx.lineTo(x, cy + Math.sin(x * 0.011 + lt * 2) * 40 + (hash(x) - 0.5) * 50);
    dctx.lineTo(W + 40, H + 40); dctx.closePath(); dctx.fill();
    dctx.restore();
    pour(c => {
      for (let i = 0; i < 260; i++) {
        const x = hash(i * 1.3) * W, y = cy + 30 + hash(i + 7) * 140;
        c.fillRect(x, y, 1.5 + hash(i + 3) * 2, 1.5 + hash(i + 3) * 2);
      }
    }, 0.8 * (1 - curtain), 0.4);
  }
  // the finger writes 冬冬
  const back = smooth(prog(lt, 7.0, 8.6));   // strokes fill back in
  writeDong(CH[0].x, CH[0].y, CH[0].s, prog(lt, 1.8, 4.2), { strength: () => 1 - back });
  writeDong(CH[1].x, CH[1].y, CH[1].s, prog(lt, 4.0, 6.4), { strength: i => i === 4 ? 1 : 1 - back, skip: i => i === 4 && lt > 7.2 });
  // the last dot grows into the moon and drifts to its place in the sky
  const m = smooth(prog(lt, 7.2, 9.0));
  if (lt > 7.2) {
    const mx = lerp(LAST_DOT[0], MOON2.x, m), my = lerp(LAST_DOT[1], MOON2.y, m), r = lerp(12, MOON2.r, m);
    moonAt(mx, my, r, 1);
  }
}
function moonAt(x, y, r, k) {
  if (k <= 0) return;
  // thin the sand around it: the glow
  clearShape(c => { c.beginPath(); c.arc(x, y, r * 2.4, 0, Math.PI * 2); c.fill(); }, 0.35 * k, r * 0.9);

// ---------- scene 2: night, the cattery van arrives (10 - 20s) ----------

function scene4(lt) {

// Crossfade between sub-compositions: [drawFn, startTime] pairs.
function morph(lt, parts, fade) {
  let i = parts.length - 1;
  while (i > 0 && lt < parts[i][1]) i--;
  const next = parts[i + 1], k = next ? prog(lt, next[1] - fade, next[1]) : 0;
  if (lt < parts[i][1] && i === 0) { parts[0][0](lt); return; }
  if (next && k > 0) {
    parts[i][0](lt - parts[i][1]); copyTo(TC);
    clearSand(); next[0](0); copyTo(TD);
    blend(TC, TD, smooth(k));
  } else {
    parts[i][0](lt - parts[i][1]);
  }
}

// ---------- scene 5: four seasons at the window (40 - 50s) ----------
const WIN = { x0: 404, x1: 876, y0: 90, y1: 500 };
function windowPath(c) {

  c.beginPath(); c.moveTo(x0, y1); c.lineTo(x0, y0 + r); c.arc((x0 + x1) / 2, y0 + r, r, Math.PI, 0); c.lineTo(x1, y1); c.closePath();
}
const SEASON_LEN = 2.5;
function scene5(lt) {
  // the wall, with the window opening cleared out of it
  pour(c => { c.fillRect(0, 0, W, H); }, 0.62, 0);
  base(1, 640, 300, { thin: 0, thick: 0.15, frame: 0.12 });
  clearShape(c => { windowPath(c); c.fill(); }, 1, 3);
  // outside, clipped to the window: one season fading into the next
  dctx.save();
  windowPath(dctx); dctx.clip();
  const f = lt / SEASON_LEN, i = Math.min(3, Math.floor(f)), k = smooth(clamp((f - i - 0.75) / 0.25));
  season(i, (1 - (i < 3 ? k : 0)), lt);
  if (i < 3 && k > 0) season(i + 1, k, lt);
  dctx.restore();
  // frame, glazing bars and sill
  pour(c => {
    windowPath(c); c.lineWidth = 16; c.stroke();
    c.fillRect(636, WIN.y0, 9, WIN.y1 - WIN.y0); c.fillRect(WIN.x0, 300, WIN.x1 - WIN.x0, 9);
    c.fillRect(360, 500, 560, 30);
  }, 1, 1.4);
  pour(c => { c.fillRect(380, 530, 520, 200); }, 0.25, 20);
  // snow on the sill in winter
  const snow = smooth(prog(lt, 3 * SEASON_LEN + 0.4, 3 * SEASON_LEN + 1.6));
  if (snow > 0) clearShape(c => { c.beginPath(); c.moveTo(360, 506); for (let x = 360; x <= 920; x += 40) c.quadraticCurveTo(x + 20, 494 - hash(x) * 6, x + 40, 506); c.lineTo(920, 512); c.lineTo(360, 512); c.closePath(); c.fill(); }, 0.9 * snow, 2);
  // 冬冬 on the sill, from behind, growing up through the year
  const s = lerp(0.42, 0.8, smooth(prog(lt, 0.3, 9.5)));
  catBack(640, 502, s, 1, { seed: 51 });
}
function season(i, w, lt) {
  if (w <= 0) return;
  const { x0, x1, y0, y1 } = WIN;
  const sky = [0.1, 0.24, 0.16, 0.34][i];
  pour(c => { c.fillRect(x0, y0, x1 - x0, y1 - y0); }, sky * w, 0);
  pour(c => { c.beginPath(); c.moveTo(x0, 470); c.quadraticCurveTo(640, 430, x1, 462); c.lineTo(x1, y1); c.lineTo(x0, y1); c.closePath(); c.fill(); }, 0.6 * w, 4);
  if (i === 0) {   // spring: a blossoming branch, petals drifting
    pour(c => { c.lineCap = 'round'; c.lineWidth = 12; c.beginPath(); c.moveTo(x1 + 10, 150); c.quadraticCurveTo(740, 170, 640, 250); c.stroke(); c.lineWidth = 6; c.beginPath(); c.moveTo(760, 172); c.quadraticCurveTo(720, 130, 680, 120); c.stroke(); }, w, 1.2);
    [[680, 120], [640, 250], [720, 200], [800, 160], [760, 230]].forEach(([x, y], j) => {
      pour(c => { c.beginPath(); c.arc(x, y, 14, 0, Math.PI * 2); c.fill(); }, 0.7 * w, 2);
      for (let q = 0; q < 5; q++) { const a = q * 1.2566 + j; poke(x + Math.cos(a) * 7, y + Math.sin(a) * 7, 3.6, w); }
    });
    for (let j = 0; j < 14; j++) {
      const px = x0 + ((hash(j) * 500 + lt * 30) % 480), py = y0 + ((hash(j + 3) * 400 + lt * 40) % 400);
      poke(px + Math.sin(lt * 2 + j) * 8, py, 3, 0.8 * w);
    }
  } else if (i === 1) {   // summer: sun and a full tree
    clearShape(c => { c.beginPath(); c.arc(780, 190, 48, 0, Math.PI * 2); c.fill(); }, w, 3);
    for (let j = 0; j < 10; j++) {
      const a = j * Math.PI / 5 + lt * 0.3;
      carve([[780 + Math.cos(a) * 64, 190 + Math.sin(a) * 64], [780 + Math.cos(a) * 92, 190 + Math.sin(a) * 92]], 4, 1, 0.8 * w);
    }
    pour(c => {
      c.fillRect(520, 300, 18, 170);
      for (const [x, y, r] of [[530, 270, 80], [470, 320, 56], [596, 316, 60], [530, 200, 56]]) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
    }, 0.95 * w, 2);
    for (let j = 0; j < 9; j++) carve(sample([[[470 + hash(j) * 130, 230 + hash(j + 1) * 120], [480 + hash(j) * 130, 226 + hash(j + 1) * 120], [490 + hash(j) * 130, 232 + hash(j + 1) * 120]]], 5), 2.4, 1, 0.45 * w);
  } else if (i === 2) {   // autumn: a sparser tree, leaves falling
    pour(c => {
      c.lineCap = 'round'; c.lineWidth = 16; c.beginPath(); c.moveTo(530, 470); c.lineTo(530, 300); c.stroke();
      c.lineWidth = 7; c.beginPath(); c.moveTo(530, 330); c.quadraticCurveTo(580, 270, 620, 250); c.moveTo(530, 350); c.quadraticCurveTo(480, 290, 450, 270); c.stroke();
      for (const [x, y, r] of [[620, 244, 30], [450, 262, 26], [540, 280, 34]]) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
    }, 0.9 * w, 1.6);
    for (let j = 0; j < 12; j++) {
      const px = x0 + ((hash(j + 9) * 480 + lt * 22) % 470), py = y0 + ((hash(j + 4) * 400 + lt * 46) % 380);
      const a = lt * 2 + j;
      pour(c => { c.beginPath(); c.ellipse(px + Math.sin(lt * 1.6 + j) * 14, py, 9, 5, a, 0, Math.PI * 2); c.fill(); }, 0.9 * w, 1);
    }
  } else {   // winter: snow
    pour(c => { c.lineCap = 'round'; c.lineWidth = 14; c.beginPath(); c.moveTo(530, 470); c.lineTo(530, 300); c.stroke(); c.lineWidth = 6; c.beginPath(); c.moveTo(530, 330); c.lineTo(600, 260); c.moveTo(530, 350); c.lineTo(462, 280); c.stroke(); }, 0.85 * w, 1.4);
    clearShape(c => { c.beginPath(); c.moveTo(x0, 452); c.quadraticCurveTo(640, 424, x1, 452); c.lineTo(x1, 470); c.lineTo(x0, 470); c.closePath(); c.fill(); }, 0.8 * w, 4);
    for (let j = 0; j < 40; j++) {
      const px = x0 + ((hash(j + 21) * 480 + Math.sin(lt + j) * 10) % 472), py = y0 + ((hash(j + 7) * 400 + lt * (30 + hash(j) * 30)) % 400);
      poke(px, py, 2 + hash(j + 2) * 2.5, 0.9 * w);
    }
  }
}

// ---------- scene 6: the rooftop, then only the moon (50 - 60s) ----------
const MOON6 = { x: 420, y: 250, r: 118 };
const TOWN = (() => {
  const out = []; let x = -10;
  for (let i = 0; x < 560; i++) {
    const w = 30 + hash(i) * 34, h = 22 + hash(i + 9) * 40, roof = 10 + hash(i + 3) * 16;
    out.push({ x, w, h, roof, chimney: hash(i + 21) > 0.7 });
    x += w + 2;
  }
  return out;
})();
const STARS6 = Array.from({ length: 14 }, (_, i) => [80 + hash(i + 3) * 760, 40 + hash(i + 17) * 140, 1.6 + hash(i + 5) * 2.2])
  .filter(([x, y]) => Math.hypot(x - MOON6.x, y - MOON6.y) > MOON6.r + 30);
const BLOSSOMS = [[990, 40], [1040, 280], [850, 170], [880, 230], [1060, 70], [1150, 95], [960, 200], [1020, 240], [1100, 120]];
function rooftop(lt) {
  base(1, MOON6.x, MOON6.y, { thin: 0.02, thick: 0.5 });
  moonAt(MOON6.x, MOON6.y, MOON6.r, 1);
  stars(STARS6, 1, lt);
  // town
  pour(c => {
    c.beginPath(); c.moveTo(-10, 604);
    TOWN.forEach(b => {
      const yb = 604 - b.h;
      c.lineTo(b.x, yb);
      if (b.chimney) { c.lineTo(b.x + b.w * 0.2, yb - b.roof * 0.4); c.lineTo(b.x + b.w * 0.2, yb - b.roof - 8); c.lineTo(b.x + b.w * 0.28, yb - b.roof - 8); }
      c.lineTo(b.x + b.w / 2, yb - b.roof); c.lineTo(b.x + b.w, yb);
    });
    c.lineTo(560, 604); c.lineTo(560, H); c.lineTo(-10, H); c.closePath(); c.fill();
  }, 0.3, 2.2);
  TOWN.forEach((b, i) => { if (hash(i + 31) > 0.3) poke(b.x + b.w * (0.35 + hash(i + 5) * 0.3), 604 - b.h + 10 + hash(i + 6) * 12, 2.2, 0.75); });
  // roof
  pour(c => {
    c.beginPath(); c.moveTo(500, H); c.lineTo(548, 590); c.quadraticCurveTo(560, 578, 580, 578);
    c.lineTo(1170, 578); c.quadraticCurveTo(1200, 580, 1280, 640); c.lineTo(1280, H); c.closePath(); c.fill();
  }, 0.95, 1.2);
  [[612, 0.5], [646, 0.32], [684, 0.2]].forEach(([y, s], row) => {
    for (let i = 0; i < 9; i++) {
      const x0 = 600 + i * 76 - row * 30 + hash(i + row * 9) * 10;
      if (x0 < 1290) carve(sample([[[x0, y], [x0 + 34, y + 16], [x0 + 70, y + 2]]], 12), 3, 1, s);
    }
  });
  // the two of them sitting on the ridge, her head on his shoulder; 冬冬 beside them
  pour(c => {
    const seated = (x, top, w) => {   // shoulders and back, seen from behind
      c.beginPath();
      c.moveTo(x - w * 0.5, 582); c.lineTo(x - w * 0.52, top + 34);
      c.quadraticCurveTo(x - w * 0.5, top + 6, x - w * 0.2, top + 2);
      c.lineTo(x + w * 0.2, top + 2); c.quadraticCurveTo(x + w * 0.5, top + 6, x + w * 0.52, top + 34);
      c.lineTo(x + w * 0.5, 582); c.closePath(); c.fill();
      c.fillRect(x - 9, top - 14, 18, 20);   // neck
    };
    seated(720, 470, 78);
    seated(800, 446, 92);
    // her head leaning on his shoulder, long hair falling down her back
    c.beginPath(); c.ellipse(742, 432, 24, 27, 0.35, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(728, 466, 25, 44, 0.15, 0, Math.PI * 2); c.fill();
    // his head, slightly turned towards her
    c.beginPath(); c.ellipse(796, 404, 27, 30, -0.08, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(793, 390, 28, 20, 0, 0, Math.PI * 2); c.fill();
  }, 1, 1.4);
  catBack(930, 582, 0.6, 1, { rim: 1, seed: 71 });
  // plum branch with blossoms
  pour(c => {
    c.lineCap = 'round'; c.lineJoin = 'round';
    const segs = [[[[1300, 70], [1120, 90], [1010, 170]], [[1010, 170], [940, 220], [880, 230]]], [[[1090, 115], [1060, 60], [990, 40]]], [[[1010, 170], [1000, 230], [1040, 280]]], [[[930, 214], [900, 180], [850, 170]]]];
    [16, 7, 6, 5].forEach((w, i) => {
      const pts = sample(segs[i], 18);
      for (let s = 0; s < pts.length - 1; s++) { c.lineWidth = lerp(w, w * 0.35, s / pts.length); c.beginPath(); c.moveTo(...pts[s]); c.lineTo(...pts[s + 1]); c.stroke(); }
    });
  }, 1, 1.2);
  BLOSSOMS.forEach(([x, y], i) => {
    pour(c => { c.beginPath(); c.arc(x, y, 12, 0, Math.PI * 2); c.fill(); }, 0.7, 2);
    const s = 0.8 + hash(i) * 0.5;
    for (let j = 0; j < 5; j++) { const a = j * 1.2566 + i * 0.7; poke(x + Math.cos(a) * 7 * s, y + Math.sin(a) * 7 * s, (3.2 + hash(i * 5 + j)) * s, 1); }
  });
  // clouds
  [sample([[[150, 330], [330, 300], [470, 340]], [[470, 340], [600, 380], [700, 330]]], 24), sample([[[230, 372], [380, 352], [520, 384]]], 24)]
    .forEach((pts, i) => carve(pts, [12, 8][i], 1, [0.9, 0.75][i]));
}
function onlyMoon(lt) {
  base(1, MOON6.x, MOON6.y, { thin: 0.02, thick: 0.5 });
  moonAt(MOON6.x, MOON6.y, MOON6.r, 1);
  stars(STARS6, prog(lt, 0.3, 1.5), lt);
  // the finger writes 冬冬 again, smaller, and a line of thanks
  writeDong(690, 200, 150, prog(lt, 0.3, 1.6));
  writeDong(850, 200, 150, prog(lt, 1.4, 2.7));
  carveText('谢谢你，来到我们身边', 850, 440, 44, prog(lt, 2.5, 3.5), 1);
}
let DIM = 1;
function scene6(lt) {
  const k = prog(lt, 2.8, 4.4);
  if (k <= 0) rooftop(lt);
  else if (k < 1) { rooftop(lt); copyTo(TA); clearSand(); onlyMoon(0); copyTo(TB); sweepBlend(TA, TB, k, 1); }
  else onlyMoon(lt - 4.4);
  DIM = 1 - smooth(prog(lt, 8.5, 9.95));
}

// ---------- transitions ----------
function copyTo(T) { const c = T.getContext('2d'); c.globalCompositeOperation = 'copy'; c.drawImage(dens, 0, 0); c.globalCompositeOperation = 'source-over'; }
// Sand flowing from one picture into the next.
function blend(A, B, k) {
  clearSand();
  dctx.save();
  dctx.globalCompositeOperation = 'lighter';
  dctx.globalAlpha = 1 - k; dctx.drawImage(A, 0, 0);
  dctx.globalAlpha = k; dctx.drawImage(B, 0, 0);
  dctx.restore();
}
// A palm sweeps across: the old picture is pushed into a moving bank of sand,
// leaving grainy, uneven streaks over the new one, which fade as it settles.
function sweepBlend(A, B, k, dir) {
  const sx = dir > 0 ? lerp(-180, W + 180, ease(k)) : lerp(W + 180, -180, ease(k));
  clearSand();
  dctx.drawImage(A, 0, 0);
  dctx.save();
  dctx.beginPath();
  if (dir > 0) dctx.rect(-10, -10, sx + 10, H + 20); else dctx.rect(sx, -10, W - sx + 10, H + 20);
  dctx.clip();
  dctx.globalCompositeOperation = 'source-over';
  dctx.fillStyle = '#000'; dctx.fillRect(0, 0, W, H);
  dctx.drawImage(B, 0, 0);
  // residue: many fine, broken, slightly curving streaks
  const fade = 1 - smooth(k);
  dctx.globalCompositeOperation = 'lighter';
  dctx.filter = 'blur(1.2px)';
  dctx.lineCap = 'round';
  for (let i = 0; i < 240; i++) {
    const y = hash(i * 1.37) * H, len = 160 + hash(i + 9) * 620, x0 = dir > 0 ? sx - 40 - hash(i + 4) * 1100 : sx + 40 + hash(i + 4) * 1100;
    const x1 = dir > 0 ? Math.min(sx - 30, x0 + len) : Math.max(sx + 30, x0 - len);
    dctx.strokeStyle = `rgba(255,255,255,${(0.03 + hash(i + 6) * 0.1) * fade})`;
    dctx.lineWidth = 0.6 + hash(i + 2) * 2.6;
    dctx.setLineDash([4 + hash(i + 11) * 40, 2 + hash(i + 13) * 18]);
    dctx.lineDashOffset = hash(i + 15) * 50;
    const bow = (hash(i + 17) - 0.5) * 18;
    dctx.beginPath(); dctx.moveTo(x0, y); dctx.quadraticCurveTo((x0 + x1) / 2, y + bow, x1, y + bow * 0.4); dctx.stroke();
  }
  dctx.restore();
  // the bank of sand riding in front of the palm
  const bank = clamp(k * 1.6, 0.3, 1) * (1 - prog(k, 0.85, 1));
  pour(c => {
    c.beginPath();
    const back = dir > 0 ? sx - 90 : sx + 90;
    c.moveTo(back, -20);
    for (let y = -20; y <= H + 20; y += 24) c.lineTo(sx - dir * 40 + Math.sin(y * 0.031 + k * 4) * 16 + (hash(y) - 0.5) * 10, y);
    c.lineTo(sx + dir * 8, H + 20); c.lineTo(sx + dir * 8, -20); c.closePath(); c.fill();
  }, 0.95 * bank, 16);
}

// ---------- timeline ----------
const SCENES = [
  { start: 0, draw: scene1, out: { type: 'flow', dur: 1.0 } },
  { start: 10, draw: scene2, out: { type: 'sweep', dur: 1.6, dir: 1 } },
  { start: 20, draw: scene3, out: { type: 'flow', dur: 1.3 } },
  { start: 30, draw: scene4, out: { type: 'sweep', dur: 1.6, dir: -1 } },
  { start: 40, draw: scene5, out: { type: 'flow', dur: 1.4 } },
  { start: 50, draw: scene6 },
];
function drawAt(i, lt) { clearSand(); SCENES[i].draw(lt); }

// ---------- shading: density -> light through sand ----------
let GRAIN = null, LIGHT = null;
const out = ctx.createImageData(W, H);
function noiseLayer(seed, blur) {
  const c = new OffscreenCanvas(W, H), x = c.getContext('2d', { willReadFrequently: true });
  const id = x.createImageData(W, H), r = rng(seed);
  for (let i = 0; i < W * H; i++) { const v = r() * 255; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; }
  x.putImageData(id, 0, 0);
  if (!blur) return id.data;
  const c2 = new OffscreenCanvas(W, H), x2 = c2.getContext('2d', { willReadFrequently: true });
  x2.filter = `blur(${blur}px)`; x2.drawImage(c, 0, 0);
  const d = x2.getImageData(0, 0, W, H).data;
  let lo = 255, hi = 0;
  for (let i = 0; i < W * H; i++) { lo = Math.min(lo, d[i * 4]); hi = Math.max(hi, d[i * 4]); }
  const o = new Uint8ClampedArray(W * H * 4);
  for (let i = 0; i < W * H; i++) o[i * 4] = (d[i * 4] - lo) / (hi - lo) * 255;
  return o;
}
function lightField() {
  const L = new Float32Array(W * H * 3);
  const [a, b, e] = LOOK.light;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const dx = (x - W * 0.47) / W, dy = (y - H * 0.42) / H;
    const r = Math.sqrt(dx * dx + dy * dy * 1.6);
    const k1 = clamp(r / 0.45), k2 = clamp((r - 0.45) / 0.35);
    const i = (y * W + x) * 3;
    for (let j = 0; j < 3; j++) L[i + j] = lerp(lerp(a[j], b[j], k1), e[j], k2);
  }
  return L;
}
const EXP = new Float32Array(2048);
for (let i = 0; i < 2048; i++) EXP[i] = Math.exp(-LOOK.k * i / 512);
function shade(dim) {
  const d = dctx.getImageData(0, 0, W, H).data;
  const { fine, mid, coarse } = GRAIN;
  const L = LIGHT, [sr, sg, sb] = LOOK.sand, o = out.data, gr = LOOK.grain;
  for (let i = 0, p = 0; i < W * H; i++, p += 4) {
    const den = d[p] / 255;
    const g = fine[p] / 255, m = mid[p] / 255, cg = coarse[p] / 255;
    let e = den * (0.45 + gr * (0.9 * g * g + 0.35 * (m - 0.5)) + 0.25 * (cg - 0.5));
    e = e < 0 ? 0 : e * 1.25;
    const T = EXP[Math.min(2047, (e * 512) | 0)] * dim;
    const q = i * 3;
    let r = L[q] * T + sr * (1 - T) * dim, gg = L[q + 1] * T + sg * (1 - T) * dim, b = L[q + 2] * T + sb * (1 - T) * dim;
    if (den > 0.45 && g > 0.993) { r += 55 * dim; gg += 45 * dim; b += 35 * dim; }
    o[p] = r; o[p + 1] = gg; o[p + 2] = b; o[p + 3] = 255;
  }
  ctx.putImageData(out, 0, 0);
  bctx.filter = 'blur(10px)';
  bctx.clearRect(0, 0, bloom.width, bloom.height);
  bctx.drawImage(canvas, 0, 0, bloom.width, bloom.height);
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.35;
  ctx.drawImage(bloom, 0, 0, W, H);
  ctx.restore();
}

function renderFrame(t) {
  t = clamp(t, 0, DURATION - 1e-6);
  let i = SCENES.length - 1;
  while (i > 0 && t < SCENES[i].start) i--;
  const S = SCENES[i], end = i + 1 < SCENES.length ? SCENES[i + 1].start : DURATION, lt = t - S.start;
  DIM = 1;
  if (S.out && t > end - S.out.dur) {
    const k = prog(t, end - S.out.dur, end);
    drawAt(i, lt); copyTo(TA);
    drawAt(i + 1, 0); copyTo(TB);
    if (S.out.type === 'flow') blend(TA, TB, smooth(k)); else sweepBlend(TA, TB, k, S.out.dir);
  } else {
    drawAt(i, lt);
  }
  shade(DIM);
}

window.FPS = FPS;
window.DURATION = DURATION;
window.renderFrame = renderFrame;
window.ready = (async () => {
  await document.fonts.load(`38px ${CJK}`, '谢谢你').catch(() => {});
  GRAIN = { fine: noiseLayer(7, 0), mid: noiseLayer(11, 2.2), coarse: noiseLayer(23, 18) };
  LIGHT = lightField();
  renderFrame(6.5);
  return true;
})();

if (!location.search.includes('render')) {
  window.ready.then(() => {
    const start = performance.now();
    const tick = now => { renderFrame(((now - start) / 1000) % DURATION); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
</script>
