<script>
// 冬冬和我们 — a pixel-art music video about a couple and their white chinchilla kitten.
//
// The picture is drawn into a 320x180 pixel buffer and scaled up 4x with no
// smoothing, so every "pixel" is a crisp 4x4 block. Captions are drawn on top
// at full resolution in Unifont (a bitmap-style font that covers Chinese).
// Every frame is a pure function of time t. Timing follows the soundtrack in
// cat-mv-music.mjs: 120 BPM, one scene per 4 bars (8 s), 8 scenes.

const W = 1280, H = 720, FPS = 30;
const BPM = 120, BEAT = 60 / BPM, BAR = BEAT * 4, SCENE = BAR * 4, DURATION = SCENE * 8;
const LW = 320, LH = 180;
const PIXEL = '"Unifont", monospace';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const low = document.createElement('canvas');
low.width = LW; low.height = LH;
const lctx = low.getContext('2d');
const img = lctx.createImageData(LW, LH);
const buf = new Uint32Array(img.data.buffer);

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeInOutCubic = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutBack = k => { const s = 1.70158; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ---------- pixel buffer ----------
const COLORS = new Map();
function col(hex) {
  let c = COLORS.get(hex);
  if (c === undefined) {
    const n = parseInt(hex.slice(1), 16);
    c = ((255 << 24) | ((n & 255) << 16) | (n & 0xff00) | ((n >> 16) & 255)) >>> 0;  // ABGR
    COLORS.set(hex, c);
  }
  return c;
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bayer = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;

let CLIP = null;   // optional [x0, y0, x1, y1] clip rectangle
function px(x, y, hex) {
  x = Math.floor(x); y = Math.floor(y);
  if (x < 0 || y < 0 || x >= LW || y >= LH) return;
  if (CLIP && (x < CLIP[0] || y < CLIP[1] || x >= CLIP[2] || y >= CLIP[3])) return;
  buf[y * LW + x] = col(hex);
}
function rect(x, y, w, h, hex) {
  x = Math.round(x); y = Math.round(y);
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) px(i, j, hex);
}
// Ordered-dither fill: covers `level` (0..1) of the pixels, the classic pixel-art "transparency".
function drect(x, y, w, h, hex, level) {
  x = Math.round(x); y = Math.round(y);
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (bayer(i, j) < level) px(i, j, hex);
}
function disc(cx, cy, r, hex, level = 1) {
  cx = Math.round(cx); cy = Math.round(cy);
  for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++)
    if (i * i + j * j <= r * r + r * 0.6 && (level >= 1 || bayer(cx + i, cy + j) < level)) px(cx + i, cy + j, hex);
}
function line(x0, y0, x1, y1, hex) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    px(x0, y0, hex);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
// Dithered vertical gradient through a list of colour stops.
function vgrad(y0, y1, stops) {
  for (let y = Math.max(0, y0); y < Math.min(LH, y1); y++) {
    const f = (y - y0) / (y1 - y0) * (stops.length - 1);
    const i = Math.min(stops.length - 2, Math.floor(f)), k = f - i;
    for (let x = 0; x < LW; x++) px(x, y, bayer(x, y) < k ? stops[i + 1] : stops[i]);
  }
}
function fadeToBlack(level) {
  if (level <= 0) return;
  for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) if (bayer(x, y) < level) buf[y * LW + x] = col('#000000');
}

// ---------- sprites ----------
const PAL = {
  k: '#1e1a2e', w: '#fbf8f4', g: '#d9d0d8', p: '#f4a0b4', e: '#3fbfa4', E: '#1e1a2e',
  s: '#f5c9a6', h: '#5a3a2e', c: '#ef7d5a', C: '#c65a42', j: '#41548c', b: '#2a2238',
  r: '#ff5d7a', y: '#ffd76a', n: '#c39058', N: '#93673a',
  H: '#2e1f1c', v: '#b9a3e8', V: '#9580c9', m: '#5a7bd0',
};
// The cattery seller reuses the owner sprite in different clothes.
const SELLER = { ...PAL, h: '#3a3a3a', c: '#5cb85c', C: '#3c8f40', j: '#5a5a66' };
const solid = hex => new Proxy({}, { get: () => hex });

function sprite(rows, x, y, { flip = false, pal = PAL, maxRow = Infinity } = {}) {
  x = Math.round(x); y = Math.round(y);
  const w = Math.max(...rows.map(r => r.length));
  rows.forEach((row, j) => {
    if (j >= maxRow) return;
    for (let i = 0; i < row.length; i++) {
      const ch = row[i];
      if (ch === '.') continue;
      px(flip ? x + w - 1 - i : x + i, y + j, pal[ch]);
    }
  });
}

function owner(x, y, { who = 'he', pose = 'stand', frame = 0, flip = false, holding = false, wave = false, pal = PAL } = {}) {
  const P = PEOPLE[who];
  sprite(P.head, x, y, { flip, pal });
  sprite(P.body, x, y + 9, { flip, pal });
  const legs = pose === 'sit' ? P.sit : pose === 'walk' && frame % 2 === 0 ? P.stride : P.stand;
  sprite(legs, x, y + 17, { flip, pal });
  const fx = i => flip ? x + 11 - i : x + i;
  if (holding) {
    sprite(KIT_SIT, x - 1, y + 8, { maxRow: 9, pal });
    px(fx(1), y + 16, pal.s); px(fx(10), y + 16, pal.s);   // hands under the kitten
  }
  if (wave) {   // a raised hand, swinging on the beat
    const up = frame % 2;
    px(fx(11), y + 10, pal.s); px(fx(12), y + 8 - up, pal.s); px(fx(12 + up), y + 7 - up, pal.s);
  }
}

const HEART = ['.rr.rr.', 'rrrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...'];

const ZZZ = ['kkk', '..k', '.k.', 'k..', 'kkk'];

// The cattery's delivery van, facing right; (x, y) is the top-left, wheels touch y + 24.
function van(x, y, t, moving) {
  x = Math.round(x); y = Math.round(y + (moving && Math.floor(t * 12) % 2 ? 1 : 0));
  const body = '#fff3e0', glass = '#9be0ff', stripe = '#f4a0b4';
  rect(x - 1, y - 1, 40, 22, PAL.k); rect(x + 37, y + 5, 15, 16, PAL.k);
  rect(x, y, 38, 20, body); rect(x + 38, y + 6, 13, 14, body);
  rect(x + 43, y + 7, 7, 6, glass); rect(x + 39, y + 7, 3, 6, glass);
  rect(x, y + 13, 51, 2, stripe);
  rect(x + 38, y + 6, 1, 14, '#d9cdbd');
  // paw print logo
  disc(x + 18, y + 8, 2, '#ff8fb3');
  rect(x + 14, y + 3, 2, 2, '#ff8fb3'); rect(x + 17, y + 2, 2, 2, '#ff8fb3'); rect(x + 20, y + 3, 2, 2, '#ff8fb3');
  rect(x + 50, y + 15, 2, 2, '#ffd76a'); rect(x - 1, y + 15, 1, 3, '#e2504c');
  for (let i = 0; i < 46; i++) {   // headlight beam
    const spread = i * 0.22;
    drect(x + 52 + i, y + 15 - spread * 0.4, 1, 2 + spread, '#fff3c4', 0.35 * (1 - i / 46));
  }
  for (const wx of [x + 10, x + 42]) {
    disc(wx, y + 20, 4, PAL.k);
    disc(wx, y + 20, 1, '#b8b8c8');
    const a = moving ? t * 14 : 0;
    px(wx + Math.round(3 * Math.cos(a)), y + 20 + Math.round(3 * Math.sin(a)), '#b8b8c8');
  }
}

// Pet carrier, 12x9, with a grille; `open` swings the door aside, `peek` shows the kitten's face.
function carrier(x, y, { open = false, peek = false } = {}) {
  x = Math.round(x); y = Math.round(y);
  rect(x + 3, y - 2, 6, 1, PAL.k); rect(x + 3, y - 2, 1, 2, PAL.k); rect(x + 8, y - 2, 1, 2, PAL.k);
  rect(x, y, 12, 9, PAL.k);
  rect(x + 1, y + 1, 10, 7, '#e86f7d');
  rect(x + 7, y + 2, 4, 5, open ? '#3a2a30' : '#2a2238');
  if (peek && !open) { rect(x + 7, y + 3, 4, 3, PAL.w); px(x + 8, y + 4, PAL.e); px(x + 10, y + 4, PAL.e); }
  if (!open) for (let i = 0; i < 4; i += 2) rect(x + 7 + i, y + 2, 1, 5, '#b8b8c8');
  else { rect(x + 12, y + 2, 1, 5, '#b8b8c8'); rect(x + 13, y + 2, 1, 5, '#b8b8c8'); }
}

// ---------- shared backdrops ----------
function stars(t, count = 60, maxY = 110, seed = 0) {
  const beat = Math.floor(t / BEAT);
  for (let i = 0; i < count; i++) {
    const x = Math.floor(hash(i + seed) * LW), y = Math.floor(hash(i + 50 + seed) * maxY);
    const tw = (beat + i) % 6;
    if (tw === 0) continue;
    const big = hash(i + 9 + seed) > 0.85;
    const c = big ? '#fff6c8' : '#c9c3ff';
    px(x, y, c);
    if (big && tw % 3 === 0) { px(x - 1, y, c); px(x + 1, y, c); px(x, y - 1, c); px(x, y + 1, c); }
  }
}
function moon(x, y, r = 14) {
  disc(x, y, r, '#fff3c4');
  disc(x - 5, y - 3, 3, '#efe1a8'); disc(x + 5, y + 5, 2, '#efe1a8'); disc(x + 3, y - 6, 1, '#efe1a8');
}
function skyline(t, seed, baseY, color, win, scroll = 0, minH = 20, maxH = 60) {
  const step = 26, first = Math.floor(scroll / step) - 1;
  const beat = Math.floor(t / BEAT);
  for (let n = first; n < first + 15; n++) {
    const bx = n * step - scroll;
    const w = 18 + Math.floor(hash(n * 3 + seed) * 10);
    const h = minH + Math.floor(hash(n * 7 + seed) * (maxH - minH));
    rect(bx, baseY - h, w, h, color);
    if (!win) continue;
    for (let wy = baseY - h + 4; wy < baseY - 4; wy += 6)
      for (let wx = bx + 3; wx < bx + w - 3; wx += 5)
        if (hash(n * 13 + wy * 7 + wx * 3) > 0.62 && (beat + wx + wy) % 13 !== 0) rect(wx, wy, 2, 3, win);
  }
}
// ---------- scene 1: title, night rooftops (0 - 8s) ----------
function sceneTitle(t, lt) {
  vgrad(0, 150, ['#0b0920', '#1d1846', '#3f2d6e', '#6b3f7a']);
  stars(t);
  moon(252, 38, 15);
  skyline(t, 11, 180, '#251d48', null, 0, 40, 80);
  skyline(t, 1, 180, '#16122e', '#ffd76a', 0, 20, 58);
  rect(222, 118, 46, 62, '#16122e');
  rect(220, 116, 50, 3, '#0f0c22');
  const blink = (lt % 2.5) < 0.15;
  sprite(blink ? KIT_SIT_BLINK : KIT_SIT, 238, 103);
}
function overlayTitle(t, lt) {
  const word = [...'冬冬和我们'];
  word.forEach((ch, i) => {
    const k = prog(lt, 1 + i * BEAT, 1.4 + i * BEAT);
    if (k <= 0) return;
    const y = 270 - (1 - easeOutBack(k)) * 40;
    const x = 640 - word.length * 48 + i * 96 + 48;
    pixelText(ch, x + 6, y + 6, 96, '#1e1a2e', 'center', 1);
    pixelText(ch, x, y, 96, '#fbf8f4', 'center', 1);
  });
  pixelText('一只白色金吉拉的故事', 640, 356, 32, '#d9d0ff', 'center', prog(lt, 3.6, 4.2));
  pixelText('♪ PIXEL MV ♪', 640, 404, 32, '#ffd76a', 'center', prog(lt, 4.4, 5.0) * (Math.floor(lt * 2) % 2 ? 1 : 0.7));
}

// ---------- shared evening street in front of the house (scenes 2 and 3) ----------
const STREET_Y = 132;   // where people's feet touch the pavement
function street(t) {
  // evening: starry sky, moon, warm lights in the house
  vgrad(0, 120, ['#0b0920', '#1d1846', '#3f2d6e', '#5a3f7a']);
  stars(t, 50, 100, 600);
  moon(56, 28, 11);
  for (let x = 0; x < LW; x++) {
    const h = 108 + Math.round(5 * Math.sin(x / 26) + 3 * Math.sin(x / 9));
    rect(x, h, 1, STREET_Y - h, '#22303f');
  }
  // tree
  rect(26, 100, 4, 32, '#2e221c');
  disc(28, 94, 11, '#264a36'); disc(21, 99, 6, '#2f5a40'); disc(35, 99, 6, '#1f3e2e');
  // the house, windows lit
  const hx = 200;
  rect(hx, 84, 100, 48, '#4a3d5e');
  for (let y = 88; y < 132; y += 6) rect(hx, y, 100, 1, '#43375a');
  for (let j = 0; j < 26; j++) rect(hx - 6 + j * 2, 84 - j, 112 - j * 4, 1, j % 4 ? '#6a3346' : '#56293a');
  rect(hx + 12, 96, 22, 18, '#2e2540'); rect(hx + 14, 98, 18, 14, '#ffd76a'); rect(hx + 22, 98, 2, 14, '#2e2540');
  rect(hx + 70, 104, 16, 28, '#3a2a24'); rect(hx + 72, 106, 12, 24, '#5a3d2c'); px(hx + 82, 118, '#ffd76a');
  rect(hx + 66, 130, 24, 2, '#3a3448');
  // porch light over the door
  rect(hx + 76, 98, 4, 3, '#ffe9a8');
  for (let y = 101; y < STREET_Y + 5; y++) {
    const half = (y - 101) * 0.6;
    drect(hx + 78 - half, y, half * 2, 1, '#5e5070', 0.3);
  }
  // street lamp lighting the pavement where the hand-over happens
  rect(150, 70, 2, 62, '#0f0d1c'); rect(142, 70, 10, 2, '#0f0d1c'); rect(140, 72, 6, 3, '#ffe9a8');
  for (let y = 75; y < STREET_Y + 5; y++) {
    const half = (y - 75) * 0.45;
    drect(143 - half, y, half * 2, 1, '#55507a', 0.45);
  }
  // pavement and road
  rect(0, STREET_Y, LW, 5, '#4a4660');
  drect(100, STREET_Y, 90, 5, '#6a6488', 0.5);
  rect(0, STREET_Y + 5, LW, 2, '#3a3650');
  rect(0, STREET_Y + 7, LW, LH - STREET_Y - 7, '#24222f');
  for (let x = 4; x < LW; x += 24) rect(x, 150, 12, 2, '#5a5870');
}

// ---------- scene 2: the cattery van arrives (8 - 16s) ----------
const SELLER_STOP = 182;
function sceneArrive(t, lt) {
  street(t);
  const moving = lt < 3;
  const vx = lerp(-70, 40, easeOutCubic(prog(lt, 0, 3)));
  // the couple waiting by the door, she waves as the van pulls up
  const beat = Math.floor(lt / BEAT);
  owner(244, STREET_Y - 24, { flip: true });
  owner(228, STREET_Y - 24, { who: 'she', flip: true, wave: lt > 1 && lt < 5.5, frame: beat });
  // the seller climbs out and carries the kitten over
  if (lt > 3.6) {
    const walking = lt < 6;
    const sx = lerp(94, SELLER_STOP, prog(lt, 3.6, 6));
    const frame = walking ? Math.floor(lt / (BEAT / 2)) : 1;
    owner(sx, STREET_Y - 24, { pose: walking ? 'walk' : 'stand', frame, pal: SELLER });
    rect(sx + 2, STREET_Y - 25, 9, 2, '#e2504c');   // cap

// ---------- scene 3: welcoming the kitten home (16 - 24s) ----------

// ---------- scene 6: four seasons at the window (40 - 48s) ----------
const SEASONS = [
  { sky: '#bfe6ff', ground: '#9ad46a', leaf: '#f7b6cc', leaf2: '#ff8fb3', fall: '#ffc2d6', name: '春', en: 'SPRING' },

  { sky: '#c9d6e8', ground: '#f2f6ff', leaf: '#eef3fb', leaf2: '#c9d6e8', fall: '#ffffff', name: '冬', en: 'WINTER' },

const seasonOf = lt => Math.min(3, Math.floor(lt / (BAR)));

// ---------- scene 7: sunset on the hill (48 - 56s) ----------
function sceneSunset(t, lt) {

function overlayEnd(t, lt) {

// ---------- hi-res overlay: pixel text and the RPG dialog box ----------
function pixelText(str, x, y, size, color, align = 'left', alpha = 1) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `${size}px ${PIXEL}`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
  ctx.restore();
}
function dialog(str, lt, start, end) {
  const a = prog(lt, start, start + 0.25) * (1 - prog(lt, end - 0.35, end));
  if (a <= 0) return;
  const x = 96, y = 624, w = W - 192, h = 80;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = '#fbf8f4'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#1a1430'; ctx.fillRect(x + 8, y + 8, w - 16, h - 16);
  ctx.fillStyle = '#5b4a8a'; ctx.fillRect(x + 12, y + 12, w - 24, 4);
  // cut the corners for a chunky pixel frame
  ctx.clearRect(x, y, 4, 4); ctx.clearRect(x + w - 4, y, 4, 4); ctx.clearRect(x, y + h - 4, 4, 4); ctx.clearRect(x + w - 4, y + h - 4, 4, 4);
  ctx.restore();
  const chars = [...str];
  const n = Math.floor((lt - start - 0.2) * 14);
  pixelText(chars.slice(0, Math.max(0, n)).join(''), x + 40, y + h / 2 + 4, 32, '#fbf8f4', 'left', a);
  if (n >= chars.length && Math.floor(lt * 3) % 2) {   // blinking ▼
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#ffd76a';
    const bx = x + w - 48, by = y + h - 36;
    ctx.fillRect(bx, by, 16, 4); ctx.fillRect(bx + 4, by + 4, 8, 4); ctx.fillRect(bx + 6, by + 8, 4, 4);
    ctx.restore();
  }
}

// ---------- timeline ----------
const SCENES = [
  { draw: sceneTitle, overlay: overlayTitle },
  { draw: sceneArrive, text: '那天晚上，猫舍的卖家开车把你送到了家门口。', overlay: overlayArrive },
  { draw: sceneWelcome, text: '我们一起接回了你，给你取名叫「冬冬」。', overlay: overlayWelcome },
  { draw: scenePlay, text: '你追着毛线球，跑遍了整个房间。' },
  { draw: sceneNight, text: '加班的深夜，你总趴在键盘旁陪着他。' },
  { draw: sceneSeasons, text: '春夏秋冬，你一天天长大。', overlay: overlaySeasons },
  { draw: sceneSunset, text: '谢谢你，来到我们的生命里。' },
  { draw: sceneEnd, text: '以后的每一天，我们都在一起。', textEnd: 4.0, overlay: overlayEnd },
];

// Pixelated iris wipe between scenes, like an old RPG.
function iris(k) {
  if (k >= 1) return;
  const r = k * 190, r2 = r * r, black = col('#000000');
  for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) {
    const dx = x - 160, dy = y - 90;
    if (dx * dx + dy * dy > r2) buf[y * LW + x] = black;
  }
}

function renderFrame(t) {
  t = clamp(t, 0, DURATION - 1e-6);
  const idx = Math.min(SCENES.length - 1, Math.floor(t / SCENE));
  const lt = t - idx * SCENE;
  const scene = SCENES[idx];
  CLIP = null;
  buf.fill(col('#000000'));
  scene.draw(t, lt);
  const open = idx > 0 ? easeInOutCubic(prog(lt, 0, 0.5)) : 1;
  const close = idx < SCENES.length - 1 ? easeInOutCubic(1 - prog(lt, SCENE - 0.5, SCENE)) : 1;
  iris(Math.min(open, close));
  lctx.putImageData(img, 0, 0);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(low, 0, 0, W, H);
  if (scene.overlay) scene.overlay(t, lt);
  if (scene.text) dialog(scene.text, lt, 0.6, scene.textEnd ?? SCENE - 0.2);
}

window.FPS = FPS;
window.DURATION = DURATION;
window.renderFrame = renderFrame;
window.ready = (async () => {
  await document.fonts.load(`32px ${PIXEL}`, '冬冬和我们').catch(() => {});
  renderFrame(0);
  return true;
})();

// Live preview when opened directly in a browser (render.mjs passes ?render).
// Click to play with music; the picture then follows the audio clock.
if (!location.search.includes('render')) {
  const music = document.getElementById('music');
  canvas.addEventListener('click', () => {
    if (music.paused) { music.currentTime = 0; music.play(); } else music.pause();
  });
  window.ready.then(() => {
    const start = performance.now();
    const tick = now => {
      const t = !music.paused ? music.currentTime : ((now - start) / 1000) % DURATION;
      renderFrame(t);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}
