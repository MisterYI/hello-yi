<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sand Real Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, 177.78vh); height: auto; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// Real sand on a light box, version 2: a grain simulation, no shapes drawn.
//
// What real sand art looks like (studied from frames of Kseniya Simonova's
// and other artists' performances):
//   - high contrast: glass wiped clean glows almost cream-white, thin sand is
//     golden amber, thick sand is a deep brown-black, with smoky gradients
//     between them; grain shows subtly, mostly at edges and in thin sand
//   - big forms are spread with the palm and have feathered edges; detail is
//     cut with a fingertip (clean bright lines with a ridge either side), a
//     fingernail (hair-thin lines), and rows of pressed "pearl" dots
//
// The glass is a 1280x720 grid; each cell holds a whole number of grains,
// about LAYER grains for one even layer, so a thin layer reads as a smooth
// translucent tone with fine grain rather than speckle. Every mark is made by
// a tool moving grains over time: spread (palm laying a layer), fill (a fist
// trickling sand into a shape), finger, fingernail, palm edge (擦, bulldozing
// a bank and leaving streaks), poke (pearls). Piles slump past the angle of
// repose. The simulation is stateful and deterministic: frames are produced in
// order, and seeking backwards replays from the start.

const W = 1280, H = 720, N = W * H, FPS = 30;
const LAYER = 24;          // grains in one even layer of sand
const ABSORB = 0.085;      // light lost per grain: T = exp(-ABSORB * grains)
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const img = ctx.createImageData(W, H);
const frame = new OffscreenCanvas(W, H), fctx = frame.getContext('2d');
const bloom = new OffscreenCanvas(W / 4, H / 4), bctx = bloom.getContext('2d');

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
// A confident hand stroke: quick to start, slowing into the end.
const stroke = k => 1 - Math.pow(1 - k, 2.2);
const glide = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
function mulberry(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const SEED = 20261011;
let R = mulberry(SEED);
const gauss = () => { let u = 0; while (u === 0) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * R()); };
const bez = (p0, c, p1, t) => [(1 - t) ** 2 * p0[0] + 2 * (1 - t) * t * c[0] + t * t * p1[0], (1 - t) ** 2 * p0[1] + 2 * (1 - t) * t * c[1] + t * t * p1[1]];
// A hand never draws a mathematically perfect line: add a slow, small wobble.
function humanize(pts, amp, seed) {
  if (!amp) return pts;
  return pts.map(([x, y], i) => {
    const a = pts[Math.min(i + 1, pts.length - 1)], b = pts[Math.max(i - 1, 0)];
    let nx = -(a[1] - b[1]), ny = a[0] - b[0]; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    const w = amp * (Math.sin(i * 0.11 + seed) * 0.6 + Math.sin(i * 0.037 + seed * 2.3) * 0.4);
    return [x + nx * w, y + ny * w];
  });
}
function path(segs, n = 30, wob = 0, seed = 0) {
  const pts = [];
  segs.forEach(([p0, c, p1], i) => { for (let j = i ? 1 : 0; j <= n; j++) pts.push(bez(p0, c, p1, j / n)); });
  return polyPath(humanize(pts, wob, seed));
}
function polyPath(pts) {
  const len = [0];
  for (let i = 1; i < pts.length; i++) len.push(len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = len[len.length - 1] || 1;
  return { pts, total, at(u) {
    const d = clamp(u) * total;
    let lo = 0, hi = len.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (len[m] <= d) lo = m; else hi = m; }
    const k = (d - len[lo]) / ((len[hi] - len[lo]) || 1);
    return [lerp(pts[lo][0], pts[hi][0], k), lerp(pts[lo][1], pts[hi][1], k)];
  } };
}
const ring = (cx, cy, r, a0, turns, n, wob = 0, seed = 0) => polyPath(humanize(
  Array.from({ length: n + 1 }, (_, i) => { const a = a0 + i / n * Math.PI * 2 * turns; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }), wob, seed));

// Smooth noise in [0, 1] over the glass (blurred random), for clouds of sand.
function cloud(seed, blur) {
  const c = new OffscreenCanvas(W / 4, H / 4), x = c.getContext('2d', { willReadFrequently: true });
  const id = x.createImageData(W / 4, H / 4), r = mulberry(seed);
  for (let i = 0; i < id.data.length; i += 4) { id.data[i] = id.data[i + 1] = id.data[i + 2] = r() * 255; id.data[i + 3] = 255; }
  x.putImageData(id, 0, 0);
  const c2 = new OffscreenCanvas(W, H), x2 = c2.getContext('2d', { willReadFrequently: true });
  x2.filter = `blur(${blur}px)`; x2.drawImage(c, -20, -20, W + 40, H + 40);
  const d = x2.getImageData(0, 0, W, H).data, out = new Float32Array(N);
  let lo = 1e9, hi = -1e9;
  for (let i = 0; i < N; i++) { out[i] = d[i * 4]; lo = Math.min(lo, out[i]); hi = Math.max(hi, out[i]); }
  for (let i = 0; i < N; i++) out[i] = (out[i] - lo) / (hi - lo || 1);
  return out;
}
// A soft (feathered) mask from a drawn shape, values 0..1.
function softMask(drawPath, feather = 2) {
  const c = new OffscreenCanvas(W, H), x = c.getContext('2d', { willReadFrequently: true });
  x.filter = `blur(${feather}px)`; x.fillStyle = '#fff'; x.strokeStyle = '#fff'; drawPath(x);
  const d = x.getImageData(0, 0, W, H).data, m = new Float32Array(N);
  for (let i = 0; i < N; i++) m[i] = d[i * 4 + 3] / 255;
  return m;
}

// ---------- the sand ----------
const G = new Uint16Array(N);
let BOX = null;
function touch(x0, y0, x1, y1) {
  x0 = Math.max(1, Math.floor(x0)); y0 = Math.max(1, Math.floor(y0)); x1 = Math.min(W - 2, Math.ceil(x1)); y1 = Math.min(H - 2, Math.ceil(y1));
  BOX = BOX ? [Math.min(BOX[0], x0), Math.min(BOX[1], y0), Math.max(BOX[2], x1), Math.max(BOX[3], y1)] : [x0, y0, x1, y1];
}
function drop1(x, y, k) {
  x = x | 0; y = y | 0;
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = y * W + x; G[i] = Math.min(65000, G[i] + k);
}
// Sand never lands on a single point: spread k grains over a few nearby cells.
function drop(x, y, k = 1) {
  if (k <= 3) { drop1(x, y, k); return; }
  const parts = Math.min(8, (k / 3) | 0);
  let left = k;
  for (let j = 0; j < parts; j++) {
    const c = j === parts - 1 ? left : Math.floor(k / parts);
    left -= c;
    drop1(x + (R() - 0.5) * 3.2, y + (R() - 0.5) * 3.2, c);
  }
}
// Trickle `count` grains around (x, y) with spread s, in small clumps; a soft
// mask makes landing likelier where it is higher.
function trickle(x, y, count, s, mask = null) {
  let n = count;
  while (n > 0) {
    const k = Math.min(n, 1 + ((R() * 4) | 0));
    n -= k;
    const gx = x + gauss() * s, gy = y + gauss() * s;
    if (mask) { const xi = gx | 0, yi = gy | 0; if (xi < 0 || yi < 0 || xi >= W || yi >= H || R() > mask[yi * W + xi]) continue; }
    drop(gx, gy, k);
  }
  touch(x - 3 * s, y - 3 * s, x + 3 * s, y + 3 * s);
}
// A fingertip of radius r moving along (vx, vy): grains under it go to its rim,
// mostly to the sides and a little ahead, piling ridges along the line.
function push(cx, cy, r, vx, vy, strength = 0.95, fwd = 0.6) {
  const vl = Math.hypot(vx, vy), ux = vl ? vx / vl : 0, uy = vl ? vy / vl : 0;
  const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(W - 1, Math.ceil(cx + r));
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(H - 1, Math.ceil(cy + r));
  const r2 = r * r;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const dx = x + 0.5 - cx, dy = y + 0.5 - cy, d2 = dx * dx + dy * dy;
    if (d2 > r2) continue;
    const i = y * W + x, n = G[i];
    if (!n) continue;
    const d = Math.sqrt(d2);
    const f = strength * (d < r * 0.6 ? 1 : 1 - (d - r * 0.6) / (r * 0.4) * 0.6);
    let m = Math.floor(n * f + R());
    if (m > n) m = n;
    if (!m) continue;
    G[i] = n - m;
    let ax = d ? dx / d : R() - 0.5, ay = d ? dy / d : R() - 0.5;
    if (vl) { ax += ux * fwd; ay += uy * fwd; }
    const al = Math.hypot(ax, ay) || 1; ax /= al; ay /= al;
    const chunks = Math.min(m, 4);
    let left = m;
    for (let c = 0; c < chunks; c++) {
      const k = c === chunks - 1 ? left : Math.floor(m / chunks);
      left -= k;
      const dist = r + 0.5 + R() * Math.max(2, r * 0.35);
      drop(cx + ax * dist + (R() - 0.5) * 2, cy + ay * dist + (R() - 0.5) * 2, k);
    }
  }
  touch(cx - r * 1.5 - 4, cy - r * 1.5 - 4, cx + r * 1.5 + 4, cy + r * 1.5 + 4);
}
// The side of the palm: a straight edge (half-length L) across the motion,
// carrying sand to a bank in front of it; some slips under in lanes (streaks).
const LANE = (() => { const r = mulberry(77), a = new Float32Array(4096); let v = 0.5; for (let i = 0; i < 4096; i++) { v = clamp(v + (r() - 0.5) * 0.18); a[i] = v; } return a; })();
// Lanes vary smoothly across the edge (interpolated, so no steps between cells).
const laneAt = v => { const f = Math.floor(v), k = v - f, i = ((f % 4096) + 4096) % 4096; return lerp(LANE[i], LANE[(i + 1) % 4096], k); };
function palmEdge(cx, cy, L, vx, vy, strength = 0.94, streak = 0.35) {
  const vl = Math.hypot(vx, vy);
  if (!vl) return;
  const ux = vx / vl, uy = vy / vl, px = -uy, py = ux, w = Math.max(3, vl * 1.4), ext = L + w + 4;
  const x0 = Math.max(0, Math.floor(cx - ext)), x1 = Math.min(W - 1, Math.ceil(cx + ext));
  const y0 = Math.max(0, Math.floor(cy - ext)), y1 = Math.min(H - 1, Math.ceil(cy + ext));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const dx = x + 0.5 - cx, dy = y + 0.5 - cy, a = dx * ux + dy * uy, b = dx * px + dy * py;
    if (a < -w || a > 1.5 || Math.abs(b) > L) continue;
    const i = y * W + x, n = G[i];
    if (!n) continue;
    const soft = Math.abs(b) > L - 24 ? (L - Math.abs(b)) / 24 : 1;
    const lane = laneAt(x * px + y * py);
    let m = Math.floor(n * strength * soft * (1 - streak * lane * lane) + R());
    if (m > n) m = n;
    if (!m) continue;
    G[i] = n - m;
    const ahead = 2 + R() * 4, side = Math.abs(b) > L - 24 ? Math.sign(b) * R() * 8 : (R() - 0.5) * 2;
    drop(cx + ux * ahead + px * (b + side), cy + uy * ahead + py * (b + side), m);
  }
  touch(cx - ext - 8, cy - ext - 8, cx + ext + 8, cy + ext + 8);
}
// 撒 a fist flinging sand as it swings: grains land in a fan stretched along
// the swing, in little clumps.
function cast(cx, cy, vx, vy, count, along, across) {
  const vl = Math.hypot(vx, vy) || 1, ux = vx / vl, uy = vy / vl, px = -uy, py = ux;
  let n = count;
  while (n > 0) {
    const k = Math.min(n, 1 + ((R() * 5) | 0));
    n -= k;
    const a = gauss() * along + along * 0.4, b = gauss() * across * (1 + Math.abs(a) / along * 0.5);
    drop1(cx + ux * a + px * b, cy + uy * a + py * b, k);
  }
  touch(cx - along * 3, cy - along * 3, cx + along * 3, cy + along * 3);
}
// 抹 the flat palm smoothing the layer: grains flow from fuller cells to
// emptier neighbours under the hand, evening the sand out.
function smoothUnder(cx, cy, r, amount = 0.5) {
  const x0 = Math.max(3, Math.floor(cx - r)), x1 = Math.min(W - 4, Math.ceil(cx + r));
  const y0 = Math.max(3, Math.floor(cy - r)), y1 = Math.min(H - 4, Math.ceil(cy + r));
  const r2 = r * r;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const dx = x - cx, dy = y - cy;
    if (dx * dx + dy * dy > r2) continue;
    const i = y * W + x, j = i + (((R() * 7) | 0) - 3) + (((R() * 7) | 0) - 3) * W;
    const diff = G[i] - G[j];
    if (diff > 1) { const m = Math.floor(diff * amount * 0.5 + R()); G[i] -= m; G[j] += m; }
  }
}
// 擦 the heel of the palm rubbing around a centre: sand under it is thinned and
// carried outwards, leaving a soft glowing halo.
function rubAround(cx, cy, r, ox, oy, amount = 0.35) {
  const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(W - 1, Math.ceil(cx + r));
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(H - 1, Math.ceil(cy + r));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const dx = x - cx, dy = y - cy, d2 = dx * dx + dy * dy;
    if (d2 > r * r) continue;
    const i = y * W + x, n = G[i];
    if (!n) continue;
    const m = Math.floor(n * amount * (1 - d2 / (r * r)) + R());
    if (!m) continue;
    G[i] = n - m;
    let ax = x - ox, ay = y - oy; const al = Math.hypot(ax, ay) || 1; ax /= al; ay /= al;
    const d = r * (0.6 + R() * 1.1); drop(x + ax * d, y + ay * d, m);
  }
  touch(cx - r * 2, cy - r * 2, cx + r * 2, cy + r * 2);
}
// Angle of repose: a cell much higher than a neighbour slumps onto it.
function relax() {
  if (!BOX) return;
  const [x0, y0, x1, y1] = BOX;
  const lim = LAYER * 2.2;
  for (let pass = 0; pass < 2; pass++) for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const i = y * W + x, n = G[i];
    if (n < lim) continue;
    const avg = (G[i - 1] + G[i + 1] + G[i - W] + G[i + W]) / 4;
    const diff = n - avg;
    if (diff > lim) {
      const m = (diff / 10) | 0;
      G[i] -= m * 4; G[i - 1] += m; G[i + 1] += m; G[i - W] += m; G[i + W] += m;
    }
  }
  BOX = null;
}

// ---------- actions: what the hand does, and when ----------
// spread: the palm lays a layer, approaching a target thickness where it passes
// fill:   sand trickled into a soft mask along a back-and-forth path
// leak:   a narrow stream along a path
// finger / nail: a fingertip or fingernail cutting a line
// palm:   the side of the palm sweeping
// poke:   a fingertip pressed straight down (a pearl)
const ACTIONS = [];
const act = a => { ACTIONS.push(a); return a; };
function zigzag(x0, y0, x1, y1, step) {
  const pts = []; let flip = false;
  for (let y = y0; y <= y1; y += step) { pts.push(flip ? [x1, y] : [x0, y]); pts.push(flip ? [x0, y] : [x1, y]); flip = !flip; }
  return polyPath(pts);
}
function applyAction(a, tA, tB) {
  const e = a.easeFn || (k => k);
  const u0 = e(prog(tA, a.t0, a.t1)), u1 = e(prog(tB, a.t0, a.t1));
  if (a.kind === 'poke') {
    if (tA <= a.t0 && tB > a.t0) { const [x, y] = a.path.at(0); for (let k = 0; k < 3; k++) push(x, y, a.r, 0, 0, 0.97); relax(); }
    return;
  }
  if (u1 <= u0) return;
  const p0 = a.path.at(u0), p1 = a.path.at(u1);
  const dist = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
  const stepLen = a.kind === 'finger' || a.kind === 'nail' ? Math.max(0.7, a.r * 0.3) : a.kind === 'palm' ? 2.5
    : a.kind === 'spread' || a.kind === 'smooth' || a.kind === 'rub' ? a.r * 0.25 : a.kind === 'cast' ? 6 : Math.max(2, a.s * 0.8);
  const steps = Math.max(1, Math.ceil(dist / stepLen));
  const dt = (tB - tA) / steps;
  for (let s = 0; s < steps; s++) {
    const ua = lerp(u0, u1, s / steps), ub = lerp(u0, u1, (s + 1) / steps);
    const pa = a.path.at(ua), pb = a.path.at(ub), vx = pb[0] - pa[0], vy = pb[1] - pa[1];
    switch (a.kind) {
      case 'spread': spreadStep(a, pb[0], pb[1], dt); break;
      case 'fill': case 'leak': trickle(pb[0], pb[1], Math.floor(a.rate * dt + R()), a.s, a.mask); break;
      case 'finger': case 'nail': {
        const r = a.r * (a.pressFn ? a.pressFn(ub) : 1);
        if (r > 0.5) push(pb[0], pb[1], r, vx, vy, a.strength ?? (a.kind === 'nail' ? 0.85 : 0.95), a.kind === 'nail' ? 0.3 : 0.6);
        break;
      }
      case 'palm': palmEdge(pb[0], pb[1], a.r, vx, vy, a.strength ?? 0.94, a.streak ?? 0.35); break;
      case 'cast': cast(pb[0], pb[1], vx, vy, Math.floor(a.rate * dt + R()), a.along, a.across); break;
      case 'smooth': smoothUnder(pb[0], pb[1], a.r, a.amount ?? 0.5); break;
      case 'rub': rubAround(pb[0], pb[1], a.r, a.ox, a.oy, a.amount ?? 0.35); break;
    }
  }
  // The bank in front of a moving palm would slump back into the strip just
  // cleared, leaving a line per tick; let it settle only once the sweep ends.
  if (a.kind !== 'palm' || tB >= a.t1) relax(); else BOX = null;
}
// The palm spreading sand: cells near the palm grow towards the target.
function spreadStep(a, cx, cy, dt) {
  if (!a.added) a.added = new Float32Array(N);
  const r = a.r, x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(W - 1, Math.ceil(cx + r));
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(H - 1, Math.ceil(cy + r));
  const k = a.rate * dt, inv = 1 / (2 * (r * 0.45) ** 2);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const dx = x - cx, dy = y - cy, d2 = dx * dx + dy * dy;
    if (d2 > r * r) continue;
    const i = y * W + x, want = a.target[i] - a.added[i];
    if (want <= 0) continue;
    const add = Math.min(want, a.target[i] * k * Math.exp(-d2 * inv));
    const g = Math.floor(add + R());
    a.added[i] += add;
    if (g) G[i] = Math.min(65000, G[i] + g);
  }
}
// Build a target thickness field (in grains) from a function of (x, y).
function field(fn) { const f = new Float32Array(N); for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) f[y * W + x] = Math.max(0, fn(x, y, y * W + x)) * LAYER; return f; }
// A sweeping, looping palm route over a rectangle.
function sweepRoute(x0, y0, x1, y1, loops, seed) {
  const pts = [];
  for (let i = 0; i <= 200; i++) {
    const k = i / 200;
    pts.push([lerp(x0, x1, 0.5 + 0.5 * Math.sin(k * Math.PI * 2 * loops + seed)), lerp(y0, y1, k) + Math.sin(k * 40 + seed) * 30]);
  }
  return polyPath(pts);
}

// ---------- the performance (test piece, ~21 s) ----------
const vignette = (x, y) => { const dx = (x - 640) / 640, dy = (y - 360) / 360; return Math.sqrt(dx * dx * 0.9 + dy * dy * 1.1); };
// An arc for a swinging fist, from (x0, y0) to (x1, y1), bowing by `bow`.
const swing = (x0, y0, x1, y1, bow, seed) => path([[[x0, y0], [(x0 + x1) / 2, (y0 + y1) / 2 + bow], [x1, y1]]], 300, 6, seed);
// Loops of the flat palm over a region.
const loops = (cx, cy, rx, ry, turns, drift, seed) => polyPath(humanize(Array.from({ length: 400 }, (_, i) => {
  const k = i / 399, a = k * Math.PI * 2 * turns;
  return [cx + rx * Math.cos(a) + drift * (k - 0.5) * 2, cy + ry * Math.sin(a) * (0.7 + 0.3 * Math.sin(k * 5 + seed))];
}), 8, seed));

// 撒: the empty light box; a fist flings sand on in quick fanning swings
[[-60, 160, 1340, 120, 90], [1340, 330, -60, 300, -80], [-60, 480, 1340, 520, 70], [1340, 640, -60, 660, -60], [-60, 60, 1340, 40, 40]]
  .forEach(([x0, y0, x1, y1, bow], i) => act({ kind: 'cast', t0: 0.35 + i * 0.36, t1: 0.7 + i * 0.36, easeFn: glide,
    rate: 1.6e7, along: 46, across: 70, path: swing(x0, y0, x1, y1, bow, i) }));
// 抹: the flat palm smooths it out in big loops, a little heavier at the edges
act({ kind: 'smooth', t0: 2.3, t1: 3.6, r: 150, amount: 0.7, easeFn: glide, path: loops(640, 360, 420, 230, 2.2, 160, 2) });

// 勾: the finger writes 冬冬 (撇, 横撇, 捺, 点, 点), quick strokes that slow into their ends
const DONG = [
  { segs: [[[0.47, 0.06], [0.40, 0.18], [0.24, 0.34]]], w: 0.03 },
  { segs: [[[0.38, 0.17], [0.55, 0.15], [0.72, 0.17]], [[0.72, 0.17], [0.58, 0.40], [0.24, 0.58]]], w: 0.028 },
  { segs: [[[0.40, 0.30], [0.58, 0.47], [0.86, 0.60]]], w: 0.032, nab: true },
  { segs: [[[0.46, 0.66], [0.50, 0.69], [0.54, 0.74]]], w: 0.034, dot: true },
  { segs: [[[0.44, 0.82], [0.49, 0.86], [0.54, 0.91]]], w: 0.036, dot: true },
];
function writeDong(x, y, size, t0, dur, seed) {
  const lens = DONG.map(s => s.segs.reduce((a, [p0, , p1]) => a + Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), 0));
  const total = lens.reduce((a, b) => a + b, 0) + DONG.length * 0.22;
  let tt = t0;
  DONG.forEach((s, i) => {
    const d = dur * lens[i] / total, gap = dur * 0.22 / total;
    const p = path(s.segs.map(seg => seg.map(([u, v]) => [x + u * size, y + v * size])), 24, size * 0.006, seed + i);
    const press = s.nab ? (u => 0.55 + 0.65 * Math.pow(u, 1.2) * (u > 0.88 ? (1 - u) / 0.12 : 1))
      : s.dot ? (u => 0.5 + 0.75 * Math.sin(Math.PI * u)) : (u => 0.5 + 0.6 * Math.sin(Math.PI * clamp(u * 1.1 - 0.05)));
    act({ kind: 'finger', t0: tt, t1: tt + d, r: s.w * size, pressFn: press, path: p, easeFn: stroke });
    tt += d + gap;
  });
}
writeDong(330, 160, 330, 3.9, 1.9, 1);
writeDong(640, 160, 330, 5.9, 1.9, 9);

// 擦: the side of the palm wipes it away in three curving passes (the transition)
[[200, 8.2, 0], [380, 8.75, 1], [560, 9.3, 2]].forEach(([y, t0, i]) =>
  act({ kind: 'palm', t0, t1: t0 + 0.9, r: 130, strength: 0.95, streak: 0.3, easeFn: glide,
    path: path([[[-80, y + 30], [640, y - 40 + i * 20], [1380, y + 20]]], 600) }));

// 撒+抹: a fresh night sky flung on and smoothed, heavier along the bottom
const MOON = { x: 410, y: 240, r: 72 };
[[1340, 120, -60, 90, 60], [-60, 280, 1340, 300, -70], [1340, 470, -60, 450, 60], [-60, 650, 1340, 640, -30], [1340, 690, -60, 700, 20]]
  .forEach(([x0, y0, x1, y1, bow], i) => act({ kind: 'cast', t0: 10.35 + i * 0.3, t1: 10.65 + i * 0.3, easeFn: glide,
    rate: i > 2 ? 2.4e7 : 1.4e7, along: 44, across: 66, path: swing(x0, y0, x1, y1, bow, 20 + i) }));
act({ kind: 'smooth', t0: 11.9, t1: 12.7, r: 140, amount: 0.7, easeFn: glide, path: loops(640, 300, 380, 170, 1.6, 140, 6) });
// 擦: the heel of the palm rubs a glowing halo where the moon will be
act({ kind: 'rub', t0: 12.75, t1: 13.5, r: 90, ox: MOON.x, oy: MOON.y, amount: 0.12, easeFn: glide, path: ring(MOON.x, MOON.y, 70, 0, 2.2, 200, 4, 2) });
// 勾+擦: fingers circle the moon clean from its centre outwards
act({ kind: 'finger', t0: 13.55, t1: 14.6, r: 14, strength: 0.97, easeFn: glide,
  path: polyPath(humanize(Array.from({ length: 160 }, (_, i) => { const k = i / 159, a = k * Math.PI * 2 * 3.6; const rr = 4 + k * (MOON.r - 13); return [MOON.x + rr * Math.cos(a), MOON.y + rr * Math.sin(a)]; }), 1.5, 3)) });

// 漏: a fist trickles the roof and 冬冬 on it, from behind; edges stay soft
const ROOF = softMask(c => { c.beginPath(); c.moveTo(560, 720); c.lineTo(612, 588); c.quadraticCurveTo(620, 582, 640, 582); c.lineTo(1170, 584); c.lineTo(1290, 640); c.lineTo(1290, 720); c.closePath(); c.fill(); }, 2.5);
act({ kind: 'fill', t0: 14.8, t1: 16.0, s: 9, rate: 2.6e6, mask: ROOF, path: zigzag(570, 586, 1290, 716, 16), easeFn: glide });
const CAT = { x: 900, by: 586, s: 0.75 };
const CAT_MASK = softMask(c => {
  const s = CAT.s, X = v => CAT.x + v * s, Y = v => CAT.by + v * s;
  for (const [x, y, rx, ry] of [[0, -66, 72, 74], [0, -128, 54, 42], [0, -178, 47, 44], [-32, -160, 24, 20], [32, -160, 24, 20]]) { c.beginPath(); c.ellipse(X(x), Y(y), rx * s, ry * s, 0, 0, Math.PI * 2); c.fill(); }
  for (const tri of [[[-42, -196], [-30, -232], [-10, -214]], [[42, -196], [30, -232], [10, -214]]]) { c.beginPath(); tri.forEach(([x, y], i) => i ? c.lineTo(X(x), Y(y)) : c.moveTo(X(x), Y(y))); c.closePath(); c.fill(); }
}, 1.5);
act({ kind: 'fill', t0: 16.1, t1: 17.3, s: 5, rate: 1.8e6, mask: CAT_MASK, path: zigzag(CAT.x - 58, CAT.by - 180, CAT.x + 58, CAT.by, 6), easeFn: glide });
act({ kind: 'leak', t0: 17.35, t1: 17.8, s: 5, rate: 2.6e5, easeFn: stroke,
  path: path([[[CAT.x + 40, CAT.by - 10], [CAT.x + 115, CAT.by + 2], [CAT.x + 126, CAT.by - 36]], [[CAT.x + 126, CAT.by - 36], [CAT.x + 130, CAT.by - 60], [CAT.x + 110, CAT.by - 66]]], 20, 1, 7) });

// 点: a row of pearls pressed along the halo, and a few stars
for (let i = 0; i < 13; i++) {
  const a = -Math.PI * 0.95 + i * 0.16, rr = MOON.r + 46 + (i % 2) * 6;
  act({ kind: 'poke', t0: 17.95 + i * 0.07, t1: 18.0 + i * 0.07, r: 3.2 + (i % 3) * 0.6, path: polyPath([[MOON.x + rr * Math.cos(a), MOON.y + rr * Math.sin(a)], [0, 0]]) });
}
[[180, 90], [640, 120], [760, 70], [880, 150], [1010, 90], [1130, 170], [560, 300]].forEach(([x, y], i) =>
  act({ kind: 'poke', t0: 19.0 + i * 0.08, t1: 19.05 + i * 0.08, r: 2.4 + (i % 2), path: polyPath([[x, y], [0, 0]]) }));
// a fingernail draws moonlight along the cat's head
act({ kind: 'nail', t0: 19.75, t1: 20.25, r: 1.5, easeFn: stroke,
  path: polyPath(Array.from({ length: 40 }, (_, i) => { const a = lerp(Math.PI * 1.02, Math.PI * 1.45, i / 39); return [CAT.x + 44 * CAT.s * Math.cos(a), CAT.by - 178 * CAT.s + 41 * CAT.s * Math.sin(a)]; })) });

const DURATION = 21.5;

// ---------- the hand ----------
// A backlit hand hovering over the glass: near-black, slightly soft. Poses:
// point (finger strokes, pokes), fist (casting, trickling), edge (the side of
// the palm wiping), flat (palm smoothing or rubbing). Between actions it lifts
// and travels to the next one; for long gaps it leaves the glass.
const POSE = { finger: 'point', nail: 'point', poke: 'point', cast: 'fist', fill: 'fist', leak: 'fist', palm: 'edge', smooth: 'flat', rub: 'flat' };
const handLayer = new OffscreenCanvas(W, H), hctx = handLayer.getContext('2d');
const REST = [1420, 900];   // off the glass, lower right
function poseOf(a, t) {
  const u = (a.easeFn || (k => k))(prog(t, a.t0, a.t1));
  const [x, y] = a.kind === 'poke' ? a.path.at(0) : a.path.at(u);
  const q = a.kind === 'poke' ? [x, y + 1] : a.path.at(clamp(u + 0.01));
  return { x, y, pose: POSE[a.kind], dir: Math.atan2(q[1] - y, q[0] - x), lift: 0 };
}
function handAt(t) {
  const acts = ACTIONS.slice().sort((a, b) => a.t0 - b.t0);
  const cur = acts.find(a => t >= a.t0 && t <= a.t1);
  if (cur) return poseOf(cur, t);
  const prev = acts.filter(a => a.t1 < t).pop(), next = acts.find(a => a.t0 > t);
  const from = prev ? poseOf(prev, prev.t1) : { x: REST[0], y: REST[1], pose: next ? POSE[next.kind] : 'point', dir: 0 };
  const to = next ? poseOf(next, next.t0) : { x: REST[0], y: REST[1], pose: from.pose, dir: from.dir };
  const t0 = prev ? prev.t1 : (next ? next.t0 - 0.6 : 0), t1 = next ? next.t0 : t0 + 0.6;
  const gap = t1 - t0;
  if (gap > 1.4) {   // leave the glass, come back later
    if (t - t0 < 0.5) { const k = glide(prog(t, t0, t0 + 0.5)); return { ...from, x: lerp(from.x, REST[0], k), y: lerp(from.y, REST[1], k), lift: k }; }
    if (t1 - t < 0.5) { const k = glide(prog(t, t1 - 0.5, t1)); return { ...to, x: lerp(REST[0], to.x, k), y: lerp(REST[1], to.y, k), lift: 1 - k }; }
    return null;
  }
  const k = glide(prog(t, t0, t1));
  return { x: lerp(from.x, to.x, k), y: lerp(from.y, to.y, k), pose: k < 0.5 ? from.pose : to.pose, dir: k < 0.5 ? from.dir : to.dir, lift: Math.sin(Math.PI * k) * 0.8 };
}
// Hand silhouettes, drawn as smooth closed outlines (Catmull-Rom through the
// points). Local axes: fingers towards -y, the forearm running off towards +y.
const HAND = {
  // index finger down on the glass, the other fingers curled under, thumb along the side
  point: [[0, 0], [11, 6], [14, 42], [16, 82], [30, 88], [46, 94], [56, 100], [66, 110], [76, 122], [86, 138], [92, 160], [94, 196], [88, 232], [80, 264], [80, 300],
    [94, 430], [108, 640], [110, 760], [-50, 760], [-40, 640], [-28, 430], [-20, 300], [-24, 262], [-42, 232], [-60, 204], [-68, 176], [-62, 152], [-46, 148], [-32, 160], [-18, 140],
    [-13, 92], [-12, 44], [-9, 6]],
  // a loose fist, knuckles forward, sand running out underneath
  fist: [[-52, -8], [-38, -28], [-17, -35], [4, -37], [25, -33], [43, -23], [55, -4], [60, 22], [57, 50], [47, 82], [42, 112], [54, 270], [68, 530], [72, 760],
    [-54, 760], [-48, 530], [-38, 270], [-36, 112], [-42, 84], [-60, 56], [-68, 28], [-62, 6]],
  // flat palm, fingers together and slightly spread
  flat: [[-82, -42], [-90, -10], [-74, 30], [-64, 64], [-54, 104], [-46, 142], [-52, 300], [-60, 760], [70, 760], [64, 300], [54, 142], [62, 92], [64, 32], [58, -40],
    [54, -82], [48, -118], [38, -134], [28, -132], [22, -116], [22, -98], [26, -112], [26, -142], [20, -162], [10, -166], [4, -152], [2, -114], [4, -132], [2, -164], [-4, -176],
    [-14, -176], [-20, -162], [-20, -118], [-22, -132], [-26, -154], [-34, -160], [-42, -156], [-46, -140], [-44, -100], [-50, -72], [-64, -60], [-76, -56]],
  // on its side: the little-finger edge on the glass (front, +x), thumb up
  edge: [[0, -122], [14, -114], [19, -62], [18, -6], [28, -16], [48, -28], [58, -22], [50, -4], [26, 14], [19, 46], [15, 94], [17, 124], [42, 270], [74, 530], [84, 760],
    [-70, 760], [-50, 510], [-32, 270], [-24, 124], [-20, 62], [-20, -40], [-14, -104]],
};
function spline(c, pts) {
  const n = pts.length, P = i => pts[(i + n) % n];
  c.beginPath(); c.moveTo(...P(0));
  for (let i = 0; i < n; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    c.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
  c.closePath(); c.fill();
}
function drawHand(h, t) {
  if (!h) return;
  const c = hctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, W, H);
  c.fillStyle = '#0b0502';
  const sway = Math.sin(t * 1.7) * 0.035 + Math.sin(t * 0.6) * 0.02;
  const lift = h.lift || 0;   // lifting brings the hand towards the camera: bigger, softer
  c.translate(h.x + lift * 18, h.y + lift * 26);
  c.scale(1.12 + lift * 0.08, 1.12 + lift * 0.08);
  if (h.pose === 'edge') {
    // wiping with the side of the palm, the hand is tilted: from above we see
    // the back of the hand foreshortened, fingers together along the edge
    c.rotate(h.dir - 0.28 + sway * 0.4);
    c.scale(0.58, 1.06);
    spline(c, HAND.flat);
  } else {
    c.rotate(-0.6 + sway);
    spline(c, HAND[h.pose]);
  }
  const main = canvas.getContext('2d');
  main.save();
  main.filter = `blur(${2.5 + lift * 5}px)`;
  main.globalAlpha = 0.88 - lift * 0.2;
  main.drawImage(handLayer, 0, 0);
  main.restore();
}

// ---------- simulation clock ----------
let simT = 0;
function resetSim() { G.fill(0); R = mulberry(SEED); simT = 0; for (const a of ACTIONS) a.added = null; }
function advance(t) {
  if (t < simT - 1e-6) resetSim();
  const dt = 1 / FPS / 2;
  while (simT < t - 1e-9) {
    const tB = Math.min(t, simT + dt);
    for (const a of ACTIONS) if (tB > a.t0 && simT < a.t1 + 1e-3) applyAction(a, Math.max(simT, a.t0), Math.min(tB, a.t1));
    simT = tB;
  }
}

// ---------- light through the sand ----------
// Transmission is mapped through the light box's palette: clean glass is a
// warm cream, thin sand golden, thicker amber, thick sand a deep brown-black.
const STOPS = [[0, [12, 6, 3]], [0.05, [44, 20, 8]], [0.18, [112, 56, 18]], [0.4, [190, 116, 42]], [0.62, [234, 176, 88]], [0.84, [250, 220, 148]], [1, [255, 244, 214]]];
const LUT = new Uint8Array(1024 * 3);
for (let i = 0; i < 1024; i++) {
  const T = i / 1023;
  let j = 0; while (j < STOPS.length - 2 && T > STOPS[j + 1][0]) j++;
  const [ta, ca] = STOPS[j], [tb, cb] = STOPS[j + 1], k = (T - ta) / (tb - ta);
  for (let c = 0; c < 3; c++) LUT[i * 3 + c] = lerp(ca[c], cb[c], k);
}
const ABS = new Float32Array(65536);
for (let n = 0; n < 65536; n++) ABS[n] = Math.exp(-ABSORB * n);
let LAMP = null;   // the light box is a little brighter in the middle
function lamp() { const L = new Float32Array(N); for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) L[y * W + x] = 1 - 0.18 * clamp(vignette(x, y) - 0.3); return L; }
function shade() {
  const o = img.data;
  for (let i = 0, p = 0; i < N; i++, p += 4) {
    const T = ABS[G[i]] * LAMP[i], q = ((T * 1023) | 0) * 3;
    o[p] = LUT[q]; o[p + 1] = LUT[q + 1]; o[p + 2] = LUT[q + 2]; o[p + 3] = 255;
  }
  fctx.putImageData(img, 0, 0);
  ctx.save(); ctx.filter = 'blur(0.85px)'; ctx.drawImage(frame, 0, 0); ctx.restore();   // camera optics
  bctx.filter = 'blur(8px)'; bctx.clearRect(0, 0, bloom.width, bloom.height); bctx.drawImage(canvas, 0, 0, bloom.width, bloom.height);
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.22; ctx.drawImage(bloom, 0, 0, W, H); ctx.restore();
}

function renderFrame(t) { t = clamp(t, 0, DURATION); advance(t); shade(); drawHand(handAt(t), t); }

window.FPS = FPS;
window.DURATION = DURATION;
window.renderFrame = renderFrame;
window.ready = (async () => { LAMP = lamp(); renderFrame(0); return true; })();

if (!location.search.includes('render')) {
  window.ready.then(() => {
    const start = performance.now();
    const tick = now => { renderFrame(((now - start) / 1000) % DURATION); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
</script>
</body>
