<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hello-yi motion</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, 177.78vh); height: auto; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// Motion graphics demo. Every frame is a pure function of time t (seconds):
// no Date.now, no Math.random, no state carried between frames. That is what
// lets render.mjs seek to any frame and get the exact same picture every time.

const W = 1280, H = 720, FPS = 30, DURATION = 15.5;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const SANS = '"Inter", "Inter Display", "DejaVu Sans", sans-serif';
const DISPLAY = '"Inter Display Black", "Inter Display", "Inter", sans-serif';
const SERIF = '"DejaVu Serif", "Liberation Serif", serif';
const MONO = '"DejaVu Sans Mono", "Liberation Mono", monospace';

const C = {
  orange: '#F2482B', ink: '#111111', paper: '#FAFAF7', cream: '#F4EFE3',
  blue: '#2338F5', red: '#E5322D', yellow: '#FFC531', pink: '#FF5DA2',
  teal: '#18C29C', purple: '#8B5CF6', grid: 'rgba(0,0,0,0.07)',
};

// ---------- math helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeInOutCubic = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeInCubic = k => k * k * k;
const easeOutBack = k => { const s = 1.70158; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const easeOutElastic = k => k === 0 || k === 1 ? k
  : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
// Deterministic pseudo-random in [0,1) from an integer seed.
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function timecode(t) {
  const f = Math.floor(t * FPS);
  const ff = f % FPS, s = Math.floor(f / FPS) % 60, m = Math.floor(f / FPS / 60);
  const p = n => String(n).padStart(2, '0');
  return `00:${p(m)}:${p(s)}:${p(ff)}`;
}

// ---------- drawing helpers ----------
function bg(color) { ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); }

function dotGrid(color, step = 32) {
  ctx.fillStyle = color;
  for (let x = step / 2; x < W; x += step)
    for (let y = step / 2; y < H; y += step) ctx.fillRect(x - 1, y - 1, 2, 2);
}

function lineGrid(color, step = 40) {
  ctx.strokeStyle = color; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x += step) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
  for (let y = 0; y <= H; y += step) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
  ctx.stroke();
}

function text(str, x, y, { font, color, align = 'left', base = 'alphabetic', alpha = 1 } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function hud(t, color, label) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.globalAlpha = 0.85;
  const m = 28, L = 22;
  for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
    ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke();
  }
  ctx.restore();
  text(timecode(t), W - 60, 62, { font: `600 18px ${MONO}`, color, align: 'right', alpha: 0.9 });
  if (label) text(label, 60, 62, { font: `600 15px ${MONO}`, color, alpha: 0.75 });
}

function arrow(x1, y1, x2, y2, color, k = 1) {
  if (k <= 0) return;
  const x = lerp(x1, x2, k), y = lerp(y1, y2, k);
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - 12 * Math.cos(a - 0.45), y - 12 * Math.sin(a - 0.45));
  ctx.lineTo(x - 12 * Math.cos(a + 0.45), y - 12 * Math.sin(a + 0.45));
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- scene 1: title slam (0 - 3.4s) ----------
function sceneTitle(t) {
  bg(C.orange);
  dotGrid('rgba(0,0,0,0.10)');

  const word = 'HELLO YI';
  ctx.font = `900 210px ${DISPLAY}`;
  const widths = [...word].map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0);
  let x = (W - total) / 2;
  const baseY = 400;
  [...word].forEach((ch, i) => {
    const k = prog(t, 0.15 + i * 0.07, 0.75 + i * 0.07);
    const y = baseY + (1 - easeOutBack(k)) * -260;
    const rot = (1 - easeOutCubic(k)) * (hash(i) - 0.5) * 0.8;
    ctx.save();
    ctx.globalAlpha = clamp(k * 3);
    ctx.translate(x + widths[i] / 2, y);
    ctx.rotate(rot);
    text(ch, 0, 0, { font: `900 210px ${DISPLAY}`, color: C.ink, align: 'center' });
    ctx.restore();
    x += widths[i];
  });

  // underline wipe
  const u = easeInOutCubic(prog(t, 1.0, 1.6));
  ctx.fillStyle = C.ink;
  ctx.fillRect((W - total) / 2, 440, total * u, 10);

  // subtitle
  const s = easeOutCubic(prog(t, 1.4, 2.1));
  text('motion designer', W / 2, 515 + (1 - s) * 30, {
    font: `italic 46px ${SERIF}`, color: '#FFF4EE', align: 'center', alpha: s,
  });
  text('— made with code, rendered frame by frame —', W / 2, 570, {
    font: `500 16px ${MONO}`, color: C.ink, align: 'center', alpha: prog(t, 1.9, 2.4) * 0.7,
  });

  hud(t, C.ink, 'HELLO-YI // 01 TITLE');
}

// ---------- scene 2: bouncing ball, squash & stretch (3.4 - 7.0s) ----------
function ballState(lt) {
  // Three bounces with decaying height, moving left to right.
  const bounces = [{ d: 1.0, h: 330 }, { d: 0.8, h: 210 }, { d: 0.6, h: 120 }, { d: 0.5, h: 60 }];
  const groundY = 560, r = 34;
  let acc = 0;
  for (const b of bounces) {
    if (lt < acc + b.d) {
      const k = (lt - acc) / b.d;              // 0..1 within this hop
      const height = 4 * b.h * k * (1 - k);    // parabola
      const vy = 4 * b.h * (1 - 2 * k);        // vertical speed (signed)
      return { k, y: groundY - r - height, vy, groundY, r };
    }
    acc += b.d;
  }
  return { k: 1, y: groundY - r, vy: 0, groundY, r };
}

function sceneBounce(t) {
  const lt = t - 3.4;
  bg(C.paper);
  dotGrid('rgba(0,0,0,0.08)');

  const x0 = 170, x1 = 1110, dur = 2.9;
  const ballX = lt => lerp(x0, x1, clamp(lt / dur));
  const st = ballState(lt);
  const { groundY, r } = st;

  // ground
  const g = easeOutCubic(prog(lt, 0, 0.4));
  ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(110, groundY); ctx.lineTo(110 + (W - 220) * g, groundY); ctx.stroke();
  for (let i = 0; i < 9; i++) {
    const tx = 150 + i * 125;
    if (tx < 110 + (W - 220) * g) {
      ctx.beginPath(); ctx.moveTo(tx, groundY + 8); ctx.lineTo(tx, groundY + 16); ctx.stroke();
    }
  }

  // ghost trail: the ball where it was a moment ago
  for (let j = 14; j >= 1; j--) {
    const pt = lt - j * 0.06;
    if (pt < 0) continue;
    const ps = ballState(pt);
    ctx.save();
    ctx.globalAlpha = 0.28 * (1 - j / 15);
    ctx.strokeStyle = C.blue; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(ballX(pt), ps.y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // squash near the ground, stretch with speed
  const nearGround = clamp(1 - (groundY - r - st.y) / 30);
  const speed = Math.abs(st.vy) / 1320;
  let sx = 1 + nearGround * 0.35 - speed * 0.12;
  let sy = 1 - nearGround * 0.3 + speed * 0.22;
  if (lt > dur) { sx = 1; sy = 1; }
  const bx = ballX(lt);
  ctx.save();
  ctx.translate(bx, st.y + r * (1 - sy));
  ctx.scale(sx, sy);
  ctx.fillStyle = C.blue;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // handwritten-style annotations
  const ann = { font: `italic 600 24px ${SERIF}` };
  const a1 = prog(lt, 0.3, 0.8);
  text('slow in, slow out', 250, 170, { ...ann, color: C.blue, alpha: a1 });
  arrow(330, 182, 380, 222, C.blue, easeOutCubic(prog(lt, 0.5, 0.9)));
  const a2 = prog(lt, 1.0, 1.3);
  text('squash!', 520, 640, { ...ann, color: C.red, alpha: a2 });
  arrow(560, 612, 640, 572, C.red, easeOutCubic(prog(lt, 1.05, 1.35)));
  const a3 = prog(lt, 1.3, 1.6);
  text('stretch', 820, 300, { ...ann, color: C.blue, alpha: a3 });
  arrow(860, 312, 820, 390, C.blue, easeOutCubic(prog(lt, 1.35, 1.65)));

  text('Squash & Stretch', 60, 130, { font: `800 44px ${SANS}`, color: C.ink, alpha: prog(lt, 0.1, 0.5) });
  hud(t, C.ink, 'HELLO-YI // 02 PRINCIPLES');
}

// ---------- scene 3: circle -> triangle morph (7.0 - 10.4s) ----------
function shapePoint(i, n, shape, R) {
  const u = i / n;
  if (shape === 'circle') {
    const a = u * Math.PI * 2 - Math.PI / 2;
    return [R * Math.cos(a), R * Math.sin(a)];
  }
  // triangle: walk the perimeter at the same parameter u
  const v = [0, 1, 2].map(k => {
    const a = k * (Math.PI * 2 / 3) - Math.PI / 2;
    return [R * 1.15 * Math.cos(a), R * 1.15 * Math.sin(a)];
  });
  const seg = Math.floor(u * 3), f = u * 3 - seg;
  const A = v[seg % 3], B = v[(seg + 1) % 3];
  return [lerp(A[0], B[0], f), lerp(A[1], B[1], f)];
}

function sceneMorph(t) {
  const lt = t - 7.0;
  bg(C.blue);
  dotGrid('rgba(255,255,255,0.10)');
  const cx = W / 2, cy = H / 2 + 10, R = 190;

  // spirograph lines
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = 'rgba(255,90,90,0.55)'; ctx.lineWidth = 1;
  const sp = easeOutCubic(prog(lt, 0, 1.2));
  ctx.beginPath();
  const steps = Math.floor(720 * sp);
  for (let s = 0; s <= steps; s++) {
    const a = s / 720 * Math.PI * 2 * 3;
    const rr = R * 1.25 + 40 * Math.sin(a * 7 / 3 + lt * 0.6);
    const px = rr * Math.cos(a + lt * 0.2), py = rr * Math.sin(a + lt * 0.2);
    s === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.restore();

  // the morphing shape
  const m = easeInOutCubic(prog(lt, 0.9, 2.1));
  const pop = easeOutElastic(prog(lt, 0.05, 1.0));
  const rot = lt * 0.35 + m * Math.PI / 3;
  const n = 90;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.scale(pop, pop);
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const [ax, ay] = shapePoint(i, n, 'circle', R * 0.55);
    const [bx, by] = shapePoint(i, n, 'triangle', R * 0.55);
    const px = lerp(ax, bx, m), py = lerp(ay, by, m);
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // orbiting satellites that also morph from dots to triangles
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2 - lt * 0.5;
    const orbit = (R + 90) * easeOutBack(prog(lt, 0.2 + i * 0.04, 0.9 + i * 0.04));
    const px = cx + orbit * Math.cos(a), py = cy + orbit * Math.sin(a);
    const mi = easeInOutCubic(prog(lt, 1.1 + i * 0.05, 1.8 + i * 0.05));
    ctx.save();
    ctx.translate(px, py); ctx.rotate(a + Math.PI / 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    for (let k = 0; k < 30; k++) {
      const [ax, ay] = shapePoint(k, 30, 'circle', 11);
      const [bx, by] = shapePoint(k, 30, 'triangle', 11);
      const qx = lerp(ax, bx, mi), qy = lerp(ay, by, mi);
      k === 0 ? ctx.moveTo(qx, qy) : ctx.lineTo(qx, qy);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  const label = m < 0.5 ? 'CIRCLE' : 'TRIANGLE';
  text(`MORPH  CIRCLE → TRIANGLE`, 60, H - 60, { font: `600 18px ${MONO}`, color: '#FFFFFF', alpha: 0.9 });
  text(`shape: ${label}   k=${m.toFixed(2)}`, 60, H - 90, { font: `500 15px ${MONO}`, color: '#FFFFFF', alpha: 0.6 });
  hud(t, '#FFFFFF', 'HELLO-YI // 03 MORPH');
}

// ---------- scene 4: easing comparison (10.4 - 13.4s) ----------
function sceneEasing(t) {
  const lt = t - 10.4;
  bg(C.cream);
  lineGrid('rgba(60,40,0,0.08)', 40);

  // chart
  const gx = 110, gy = 200, gw = 440, gh = 340;
  const ax = easeOutCubic(prog(lt, 0, 0.5));
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, gy + gh * ax); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(gx, gy + gh); ctx.lineTo(gx + gw * ax, gy + gh); ctx.stroke();
  text('position', gx - 6, gy - 14, { font: `500 18px ${MONO}`, color: C.ink, alpha: ax });
  text('time', gx + gw, gy + gh + 30, { font: `500 18px ${MONO}`, color: C.ink, align: 'right', alpha: ax });

  const draw = prog(lt, 0.4, 1.6);
  const plot = (fn, color, dash) => {
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 3.5; ctx.setLineDash(dash);
    ctx.beginPath();
    const N = 80;
    for (let i = 0; i <= Math.floor(N * draw); i++) {
      const k = i / N;
      const px = gx + k * gw, py = gy + gh - fn(k) * gh;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
  };
  plot(k => k, C.red, [8, 8]);
  plot(easeInOutCubic, C.blue, []);

  // moving markers on the curves, looping
  const loopK = (lt % 1.4) / 1.4;
  if (lt > 1.6) {
    for (const [fn, color] of [[k => k, C.red], [easeInOutCubic, C.blue]]) {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(gx + loopK * gw, gy + gh - fn(loopK) * gh, 8, 0, Math.PI * 2); ctx.fill();
    }
  }

  // right side: two tracks
  const tx0 = 660, tx1 = 1160;
  const rows = [
    { y: 300, fn: k => k, color: C.red, label: 'linear = robotic', strike: true },
    { y: 470, fn: easeInOutCubic, color: C.blue, label: 'ease in-out ✓', strike: false },
  ];
  rows.forEach((row, i) => {
    const show = easeOutCubic(prog(lt, 0.3 + i * 0.2, 0.8 + i * 0.2));
    ctx.save(); ctx.globalAlpha = show;
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2; ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(tx0, row.y); ctx.lineTo(tx1, row.y); ctx.stroke();
    ctx.restore();
    // ghost frames show spacing: even for linear, bunched at the ends for ease
    for (let g = 0; g <= 8; g++) {
      const px = lerp(tx0, tx1, row.fn(g / 8));
      ctx.save(); ctx.globalAlpha = show * 0.25;
      ctx.strokeStyle = row.color; ctx.lineWidth = 2;
      ctx.strokeRect(px - 18, row.y - 18, 36, 36);
      ctx.restore();
    }
    const bxp = lt > 1.6 ? lerp(tx0, tx1, row.fn(loopK)) : tx0;
    ctx.save(); ctx.globalAlpha = show;
    ctx.fillStyle = row.color; ctx.fillRect(bxp - 18, row.y - 18, 36, 36);
    ctx.restore();

    const lk = prog(lt, 0.7 + i * 0.3, 1.1 + i * 0.3);
    text(row.label, tx0, row.y - 44, { font: `italic 600 28px ${SERIF}`, color: row.color, alpha: lk });
    if (row.strike) {
      const sk = easeOutCubic(prog(lt, 1.3, 1.6));
      ctx.strokeStyle = C.red; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(tx0 - 4, row.y - 53); ctx.lineTo(tx0 - 4 + 230 * sk, row.y - 53); ctx.stroke();
    }
  });

  text('Easing', 60, 130, { font: `800 44px ${SANS}`, color: C.ink, alpha: prog(lt, 0.1, 0.5) });
  hud(t, C.ink, 'HELLO-YI // 04 TIMING');
}

// ---------- scene 5: cards + outro (13.4 - 15.5s) ----------
function sceneOutro(t) {
  const lt = t - 13.4;
  bg(C.blue);
  dotGrid('rgba(255,255,255,0.08)');

  const cards = [
    { c: C.yellow, n: '01', title: 'Code', sub: 'draw(t)' },
    { c: C.pink, n: '02', title: 'Render', sub: 'Chromium' },
    { c: C.teal, n: '03', title: 'Encode', sub: 'ffmpeg' },
    { c: C.purple, n: '04', title: 'Ship', sub: '.mp4' },
  ];
  const cw = 200, ch = 280, gap = 28;
  const startX = (W - (cw * 4 + gap * 3)) / 2;
  cards.forEach((card, i) => {
    const k = easeOutBack(prog(lt, 0.05 + i * 0.1, 0.6 + i * 0.1));
    const x = startX + i * (cw + gap);
    const y = 150 + (1 - k) * 420;
    ctx.save();
    ctx.translate(x + cw / 2, y + ch / 2);
    ctx.rotate((1 - k) * (i % 2 ? 0.3 : -0.3));
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    roundRect(-cw / 2 + 8, -ch / 2 + 12, cw, ch, 18); ctx.fill();
    ctx.fillStyle = card.c;
    roundRect(-cw / 2, -ch / 2, cw, ch, 18); ctx.fill();
    text(`// ${card.n}`, -cw / 2 + 18, -ch / 2 + 34, { font: `600 15px ${MONO}`, color: C.ink, alpha: 0.7 });
    text(card.title, -cw / 2 + 18, ch / 2 - 56, { font: `800 38px ${SANS}`, color: C.ink });
    text(card.sub, -cw / 2 + 18, ch / 2 - 24, { font: `500 17px ${MONO}`, color: C.ink, alpha: 0.75 });
    ctx.restore();
  });

  const f = easeOutCubic(prog(lt, 0.8, 1.3));
  text('Made with code. Rendered frame by frame.', W / 2, 560 + (1 - f) * 20, {
    font: `700 34px ${SANS}`, color: '#FFFFFF', align: 'center', alpha: f,
  });
  text('github.com/MisterYI/hello-yi', W / 2, 600, {
    font: `500 17px ${MONO}`, color: '#FFFFFF', align: 'center', alpha: prog(lt, 1.1, 1.5) * 0.7,
  });
  hud(t, '#FFFFFF', 'HELLO-YI // 05 PIPELINE');

  // fade to black at the very end
  const out = prog(t, DURATION - 0.35, DURATION);
  if (out > 0) { ctx.fillStyle = `rgba(0,0,0,${out})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- transitions ----------
function irisWipe(t, a, b, color) {
  const k = easeInOutCubic(prog(t, a, b));
  if (k <= 0 || k >= 1) return;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(W / 2, H / 2, k * Math.hypot(W, H) / 2, 0, Math.PI * 2); ctx.fill();
}
function slideWipe(t, a, b, color, dir) {
  const k = easeInOutCubic(prog(t, a, b));
  if (k <= 0 || k >= 1) return;
  ctx.fillStyle = color;
  if (dir === 'left') ctx.fillRect(W - W * k, 0, W * k, H);
  else ctx.fillRect(0, 0, W, H * k);
}

const SCENES = [
  [0.0, 3.4, sceneTitle],
  [3.4, 7.0, sceneBounce],
  [7.0, 10.4, sceneMorph],
  [10.4, 13.4, sceneEasing],
  [13.4, DURATION + 1, sceneOutro],
];

function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  const scene = SCENES.find(([a, b]) => t >= a && t < b) || SCENES[SCENES.length - 1];
  scene[2](t);
  // transitions cover the cut at each scene boundary
  irisWipe(t, 3.0, 3.4, C.paper);
  slideWipe(t, 6.6, 7.0, C.blue, 'left');
  slideWipe(t, 10.0, 10.4, C.cream, 'down');
  irisWipe(t, 13.0, 13.4, C.blue);
}

window.FPS = FPS;
window.DURATION = DURATION;
window.renderFrame = renderFrame;
window.ready = (async () => {
  const fonts = [`900 210px ${DISPLAY}`, `800 44px ${SANS}`, `italic 46px ${SERIF}`, `600 18px ${MONO}`];
  await Promise.all(fonts.map(f => document.fonts.load(f).catch(() => {})));
  renderFrame(0);
  return true;
})();

// Live preview when opened directly in a browser (render.mjs passes ?render).
if (!location.search.includes('render')) {
  window.ready.then(() => {
    const start = performance.now();
    const tick = now => {
      renderFrame(((now - start) / 1000) % DURATION);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}
</script>
</body>
</html>
